      }
    }

    // Frozen: rime along every upper edge, frost flecks, icicles off the
    // undersides. (The slow swim is applied to the anim in paintFish.)
    function frost(F, f, anim) {
      const solid = solidIn(F), rime = [236, 250, 255], icicle = [196, 236, 255];
      const tops = [], drips = [];
      for (let y = 0; y < FISH_H; y++) for (let x = 0; x < FISH_W; x++) {
        if (!solid(x, y)) continue;
        if (!solid(x, y - 1)) tops.push(x, y);
        else if (hash(x * 3, y + f.patternSeed) > 0.93) tops.push(x, y); // fleck
        if (!solid(x, y + 1) && hash(x, f.patternSeed) > 0.78) drips.push(x, y);
      }
      for (let i = 0; i < tops.length; i += 2) plot(F, tops[i], tops[i + 1], rime, 0.85);
      const shimmer = anim ? anim.time : 0;
      for (let i = 0; i < drips.length; i += 2) {
        const x = drips[i], y = drips[i + 1], len = 1 + Math.floor(hash(x + 9, f.patternSeed) * 3);
        for (let k = 1; k <= len; k++) plot(F, x, y + k, icicle, 0.9 - k * 0.2);
        if (anim && Math.sin(shimmer * 3 + x) > 0.9) plot(F, x, y + len, rime, 0.9);
      }
    }

    // Glowing: a soft halo in the glow colour, pulsing when animated, and a
    // little of that light bleeding into the flesh.
    function glowHalo(F, f, anim) {
      const solid = solidIn(F), glow = hx(f.glowColor || '#bff4ff'), pulse = anim ? anim.glow : 1;
      const halo = [];
      for (let y = 0; y < FISH_H; y++) for (let x = 0; x < FISH_W; x++) {
        if (solid(x, y)) { continue; }
        let d = 9;
        for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) if (solid(x + dx, y + dy)) d = Math.min(d, Math.hypot(dx, dy));
        if (d <= 3.2) halo.push(x, y, d);
      }
      for (let i = 0; i < F.length; i += 4) if (F[i + 3] >= 128) {
        const c = mix([F[i], F[i + 1], F[i + 2]], glow, 0.16 * pulse);
        F[i] = c[0]; F[i + 1] = c[1]; F[i + 2] = c[2];
      }
      for (let i = 0; i < halo.length; i += 3) plot(F, halo[i], halo[i + 1], glow, (0.62 - halo[i + 2] * 0.17) * pulse);
    }

    // Golden: a bright metallic band across the upper flank plus a few
    // twinkling glints.
    function goldSheen(F, f, anim) {
      const b = bbox(F); if (!b.ok) return;
      const solid = solidIn(F), hi = [255, 248, 200];
      const sweep = anim ? Math.sin(anim.time * 1.4) * 0.15 : 0;
      for (let y = b.y0; y <= b.y1; y++) for (let x = b.x0; x <= b.x1; x++) {
        if (!solid(x, y)) continue;
        const v = (y - b.y0) / Math.max(1, b.y1 - b.y0) - 0.3 - sweep + (x - b.x0) * 0.004;
        if (Math.abs(v) < 0.09) plot(F, x, y, hi, 0.55 * (1 - Math.abs(v) / 0.09));
      }
      const rng = makePRNG(`gold|${f.patternSeed}`);
      for (let k = 0; k < 3; k++) {
        const x = ri(rng, b.x0 + 2, b.x1 - 2), y = ri(rng, b.y0 + 1, b.y1 - 1), ph = rng() * 6;
        if (!solid(x, y)) continue;
        const tw = anim ? Math.max(0, Math.sin(anim.time * 3 + ph)) : 0.8;
        if (tw > 0.05) sparkle(F, x, y, 1, [255, 255, 236], tw);
      }
    }

    // Shiny: big four-point stars twinkling just around the silhouette.
    function shineSparkles(F, f, anim) {
      const b = bbox(F); if (!b.ok) return;
      const rng = makePRNG(`shine|${f.patternSeed}`);
      for (let k = 0; k < 4; k++) {
        const x = ri(rng, b.x0 - 2, b.x1 + 2), y = ri(rng, b.y0 - 3, b.y1 + 2), ph = rng() * 6.28;
        const tw = anim ? Math.max(0, Math.sin(anim.time * 2.6 + ph)) : [1, 0.7, 0.45, 0.8][k];
        if (tw > 0.05) sparkle(F, x, y, tw > 0.6 ? 2 : 1, k % 2 ? [255, 250, 210] : [255, 255, 255], 0.95 * tw);
      }
    }

    // Raster-level effects over the finished fish layer, in a fixed order.
    function applyEffects(F, f, anim) {
      if (hasFx(f, 'crystal')) crystalize(F, f, anim);
      if (hasFx(f, 'frozen')) frost(F, f, anim);
      if (hasFx(f, 'glowing')) glowHalo(F, f, anim);
      if (hasFx(f, 'golden')) goldSheen(F, f, anim);
      if (hasFx(f, 'shiny')) shineSparkles(F, f, anim);
      return F;
    }

    // ---- scene -------------------------------------------------------------
    function paintBackground(R, habitat, scene, cfg, seed, anim) {
      const Hb = HABITATS[habitat] || HABITATS[FIRST_HABITAT];
      const c1 = hx(scene.bg1), c2 = hx(scene.bg2), light = hx(scene.light), speck = hx(scene.speck);
      const drift = anim ? anim.time : 0, rays = Hb.rays * cfg.lightRays;
      for (let y = 0; y < FISH_H; y++) {
        const base = mix(c1, c2, y / (FISH_H - 1));
        for (let x = 0; x < FISH_W; x++) {
          plot(R, x, y, base);
          if (rays > 0) {
            const r = Math.sin((x * 0.55 + y * 0.3) * 0.45 + seed * 0.37 + drift * 0.4);
            if (r > 0.6) plot(R, x, y, light, (r - 0.6) * 0.3 * rays * (1 - y / FISH_H));
          }
        }
      }
      const n = Math.round(14 * Hb.snow); // drifting specks / marine snow
      for (let i = 0; i < n; i++) {
        const x = Math.floor(hash(i, seed) * FISH_W);
        const y = Math.floor((hash(seed, i) * FISH_H + drift * 2 * (0.5 + hash(i, i))) % FISH_H);
        plot(R, x, y, speck, 0.45);
      }
      if (Hb.nebula) { // two octaves of cloud in the scene's light colour
        for (let y = 0; y < FISH_H; y++) for (let x = 0; x < FISH_W; x++) {
          const nb = noise((x + seed + drift * 0.3) / 9, y / 7) * 0.7 + noise(x / 4, (y + seed) / 4) * 0.3;
          if (nb > 0.5) plot(R, x, y, light, (nb - 0.5) * 0.9 * Hb.nebula);
        }
      }
      const stars = Math.round(28 * (Hb.stars || 0));
      for (let i = 0; i < stars; i++) {
        const x = Math.floor(hash(i + 7, seed) * FISH_W), y = Math.floor(hash(seed, i + 7) * FISH_H);
        const tw = anim ? 0.35 + 0.65 * Math.abs(Math.sin(drift * 1.7 + i * 1.3)) : 0.4 + 0.6 * hash(i, seed + 1);
        plot(R, x, y, speck, tw);
        if (hash(i, i + seed) > 0.85) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) plot(R, x + dx, y + dy, speck, 0.3 * tw);
      }
    }
    function bubble(R, x, y, c, big, a) {
      if (!big) { plot(R, x, y, c, a); return; }
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) plot(R, x + dx, y + dy, c, a);
      plot(R, x, y, c, a * 0.15);
    }

    // ---- entry points ------------------------------------------------------
    // Paint a fish from an explicit feature object into a FISH_W x FISH_H 2D
    // context. All drawing happens in plain RGBA buffers; the context is only
    // touched once, by putImageData, so callers' transforms don't apply.
    function paintFish(ctx, f0, habitat, cfg, bgSeed, anim = null) {
      const Hb = HABITATS[habitat] || HABITATS[FIRST_HABITAT];
      const scene = cfg.scene || Hb.scene;
      const f = effectColours(f0); // mutation effects recolour a copy, never the caller's object
      const G = makeGeom(f);
      const out = raster();
      if (!cfg.transparentBackground) paintBackground(out, habitat, scene, cfg, bgSeed, anim);
      if (anim && hasFx(f, 'frozen')) anim = { ...anim, waveAmp: anim.waveAmp * 0.35, tail: anim.tail * 0.35, pect: anim.pect * 0.35 };

      const fins = raster(), body = raster();
      drawTail(fins, f, G, anim); drawDorsal(fins, f, G); drawAnal(fins, f, G); drawPelvic(fins, f, G);
      edgeDarken(fins, 0.7);
      drawBody(body, f, G);
      if (hasFx(f, 'spotted')) spotCoat(body, f);
      edgeDarken(body, 0.6);
      drawHead(body, f, G, anim);
      drawPectoral(body, f, G, anim);
      drawExtras(body, f, G, anim);
      over(fins, body);
      const fish = applyEffects(f.aura ? voidAura(fins, f, anim) : fins, f, anim);

      // Composite with optional mirroring + a swim wave that grows toward the tail.
      const flip = !!f.faceRight;
      for (let x = 0; x < FISH_W; x++) {
        let dy = 0;
        if (anim) {
          const w = clamp((x - (G.x0 + G.L * 0.3)) / (G.L * 0.7 + G.tailLen), 0, 1);
          dy = Math.round(anim.waveAmp * w * Math.sin(anim.wave - x * 0.25)) + anim.bob;
        }
        const dx = flip ? FISH_W - 1 - x : x;
        for (let y = 0; y < FISH_H; y++) {
          const i = (y * FISH_W + x) * 4, a = fish[i + 3];
          if (a) plot(out, dx, y + dy, [fish[i], fish[i + 1], fish[i + 2]], a / 255);
        }
      }

      // Bubbles rise from the mouth: a steady stream when animated, a seeded
      // few frozen in place otherwise.
      const [mx0, my] = mouthPoint(f, G), mx = flip ? FISH_W - 1 - mx0 : mx0;
      const bc = hx(scene.bubble);
      if (anim) {
        if (cfg.bubbleChance > 0) for (let i = 0; i < 3; i++) {
          const age = (anim.time * 0.45 + i / 3) % 1;
          bubble(out, mx + Math.round(Math.sin(age * 9 + i * 2)), Math.round(my - 2 - age * (my + 2)), bc, age > 0.35, 0.85 * (1 - age * 0.4));
        }
      } else {
        const rng = makePRNG(`fishbubbles|${bgSeed}`);
        if (rng() < cfg.bubbleChance) {
          const n = ri(rng, 1, 3);
          for (let k = 0; k < n; k++) bubble(out, mx + ri(rng, -1, 1), my - 3 - k * 4 - ri(rng, 0, 1), bc, k > 0, 0.85);
        }
      }
      ctx.putImageData(new ImageData(out, FISH_W, FISH_H), 0, 0);
      return f0;
    }

    // Draw one fish, deriving every feature from (seed, habitat).
    function drawFish(ctx, seedStr, habitat = FIRST_HABITAT, config = {}) {
      const cfg = { ...DEFAULT_FISH_CONFIG, ...config };
      const f = rollFeatures(makePRNG(`fish|${habitat}|${seedStr}`), habitat, cfg);
      return paintFish(ctx, f, habitat, cfg, Math.floor(hash(seedStr.length, f.patternSeed) * 1000));
    }
    // The rolled feature object for a seed — a starting point for manual editing.
    function featuresFromSeed(seedStr, habitat = FIRST_HABITAT, config = {}) {
      const cfg = { ...DEFAULT_FISH_CONFIG, ...config };
      return rollFeatures(makePRNG(`fish|${habitat}|${seedStr}`), habitat, cfg);
    }
    // Draw from an explicit feature object (creator), bypassing the roll.
    function drawFishFeatures(ctx, features, habitat = FIRST_HABITAT, config = {}, anim = null) {
      const cfg = { ...DEFAULT_FISH_CONFIG, ...config };
      return paintFish(ctx, { ...features }, habitat, cfg, features.patternSeed, anim);
    }
    // Pure idle-swim driver: (elapsed ms, per-fish phase) -> per-frame deltas,
    // so the same fish swims identically on every client without shared state.
    function fishAnim(tMs, phase = 0) {
      const t = tMs / 1000 + phase;
      return {
        time: t,
        wave: t * 6, waveAmp: 1.2,                         // body undulation
        tail: Math.sin(t * 6 - 1.2),                       // caudal beat
        pect: Math.sin(t * 8 + phase),                     // pectoral flutter
        bob: Math.round(Math.sin(t * 1.3 + phase * 2) * 0.9),
        glow: 0.65 + 0.35 * Math.sin(t * 2.2 + phase),     // lure / photophores
        gulp: t % 3.3 < 0.35,                              // mouth opens briefly
      };
    }
    // Browser-only: nearest-neighbour upscale to `width` (height keeps 4:3).
    function renderFishDataURL(seedStr, habitat = FIRST_HABITAT, width = 128, config = {}) {
      return upscaledDataURL((ctx) => drawFish(ctx, seedStr, habitat, config), width);
    }
    function renderFishFeaturesDataURL(features, habitat = FIRST_HABITAT, width = 128, config = {}) {
      return upscaledDataURL((ctx) => drawFishFeatures(ctx, features, habitat, config), width);
    }
    function upscaledDataURL(drawInto, width) {
      const src = document.createElement('canvas');
      src.width = FISH_W; src.height = FISH_H;
      drawInto(src.getContext('2d'));
      const out = document.createElement('canvas');
      out.width = width; out.height = Math.round(width * FISH_H / FISH_W);
      const octx = out.getContext('2d');
      octx.imageSmoothingEnabled = false;
      octx.drawImage(src, 0, 0, out.width, out.height);
      return out.toDataURL('image/png');
    }

    // Every editable feature, for the creator UI. Types: bool, int (min/max),
    // color (options = suggested swatches), enum (values or [label, value]).
    // `rebuild` re-renders the controls after a change (the shape preset
    // rewrites several other fields).
    const t1 = (v) => [v.charAt(0).toUpperCase() + v.slice(1), v];
    const allPool = (k) => [...new Set(Object.values(HABITATS).flatMap((h) => h[k]))];
    const FEATURE_SCHEMA = [
      { group: 'Body', key: 'shape', type: 'enum', label: 'Shape preset', options: Object.keys(SHAPES).map(t1),
        set: (f, v) => applyShapePreset(f, v), rebuild: true },
      { group: 'Body', key: 'bodyLen', type: 'int', label: 'Length', min: 16, max: 56 },
      { group: 'Body', key: 'bodyDepth', type: 'int', label: 'Depth', min: 4, max: 32 },
      { group: 'Body', key: 'peak', type: 'int', label: 'Deepest at %', min: 10, max: 70 },
      { group: 'Body', key: 'headBlunt', type: 'int', label: 'Head (1 blunt–5 sharp)', min: 1, max: 5 },
      { group: 'Body', key: 'taper', type: 'int', label: 'Tail stalk %', min: 6, max: 70 },
      { group: 'Body', key: 'backArch', type: 'int', label: 'Back arch %', min: 35, max: 65 },

      { group: 'Fins', key: 'tail', type: 'enum', label: 'Tail', options: Object.keys(TAILS).map(t1) },
      { group: 'Fins', key: 'tailLen', type: 'int', label: 'Tail length', min: 0, max: 20 },
      { group: 'Fins', key: 'tailSpan', type: 'int', label: 'Tail span', min: 1, max: 22 },
      { group: 'Fins', key: 'dorsal', type: 'enum', label: 'Dorsal', options: DORSALS.map(t1) },
      { group: 'Fins', key: 'dorsalH', type: 'int', label: 'Dorsal height', min: 0, max: 14 },
      { group: 'Fins', key: 'dorsalLean', type: 'int', label: 'Fin sweep', min: 0, max: 10 },
      { group: 'Fins', key: 'dorsalStart', type: 'int', label: 'Dorsal from %', min: 5, max: 80 },
      { group: 'Fins', key: 'dorsalEnd', type: 'int', label: 'Dorsal to %', min: 20, max: 100 },
      { group: 'Fins', key: 'anal', type: 'enum', label: 'Anal fin', options: ANALS.map(t1) },
      { group: 'Fins', key: 'analH', type: 'int', label: 'Anal height', min: 0, max: 10 },
      { group: 'Fins', key: 'analStart', type: 'int', label: 'Anal from %', min: 30, max: 90 },
      { group: 'Fins', key: 'analEnd', type: 'int', label: 'Anal to %', min: 40, max: 100 },
      { group: 'Fins', key: 'pectoral', type: 'int', label: 'Pectoral', min: 0, max: 9 },
      { group: 'Fins', key: 'pelvic', type: 'bool', label: 'Pelvic fin' },
      { group: 'Fins', key: 'finAlpha', type: 'int', label: 'Fin opacity %', min: 20, max: 100 },
      { group: 'Fins', key: 'finColor', type: 'color', label: 'Fin colour', options: allPool('fin') },

      { group: 'Head', key: 'eyeR', type: 'int', label: 'Eye size', min: 1, max: 5 },
      { group: 'Head', key: 'eyeColor', type: 'color', label: 'Iris', options: allPool('eye') },
      { group: 'Head', key: 'mouth', type: 'enum', label: 'Mouth', options: [['Terminal', 'terminal'], ['Upturned', 'up'], ['Underslung', 'down']] },
      { group: 'Head', key: 'mouthW', type: 'int', label: 'Mouth length', min: 1, max: 7 },
      { group: 'Head', key: 'lips', type: 'bool', label: 'Lips' },
      { group: 'Head', key: 'teeth', type: 'bool', label: 'Teeth' },
      { group: 'Head', key: 'barbels', type: 'int', label: 'Barbel pairs', min: 0, max: 2 },
      { group: 'Head', key: 'barbelLen', type: 'int', label: 'Barbel length', min: 2, max: 12 },

      { group: 'Colour & pattern', key: 'backColor', type: 'color', label: 'Back', options: allPool('body') },
      { group: 'Colour & pattern', key: 'bellyColor', type: 'color', label: 'Belly', options: ['#f2efe4', '#ffffff', '#e8e0c8', ...allPool('body')] },
      { group: 'Colour & pattern', key: 'patternColor', type: 'color', label: 'Pattern colour', options: allPool('pattern') },
      { group: 'Colour & pattern', key: 'pattern', type: 'enum', label: 'Pattern', options: PATTERNS.map(t1) },
      { group: 'Colour & pattern', key: 'patternCount', type: 'int', label: 'Pattern amount', min: 1, max: 6 },
      { group: 'Colour & pattern', key: 'patternSeed', type: 'int', label: 'Pattern seed', min: 0, max: 999 },
      { group: 'Colour & pattern', key: 'scales', type: 'bool', label: 'Scale texture' },
      { group: 'Colour & pattern', key: 'lateralLine', type: 'bool', label: 'Lateral line' },

      { group: 'Extras', key: 'lure', type: 'bool', label: 'Angler lure' },
      { group: 'Extras', key: 'photophores', type: 'bool', label: 'Photophores' },
      { group: 'Extras', key: 'glowColor', type: 'color', label: 'Glow colour', options: allPool('glow') },
      { group: 'Extras', key: 'spikes', type: 'bool', label: 'Spines' },
      { group: 'Extras', key: 'faceRight', type: 'bool', label: 'Face right' },

      { group: 'Eldritch', key: 'tentacles', type: 'int', label: 'Chin tentacles', min: 0, max: 6 },
      { group: 'Eldritch', key: 'tentacleLen', type: 'int', label: 'Tentacle length', min: 3, max: 16 },
      { group: 'Eldritch', key: 'extraEyes', type: 'int', label: 'Extra eyes', min: 0, max: 8 },
      { group: 'Eldritch', key: 'maw', type: 'bool', label: 'Gaping maw' },
      { group: 'Eldritch', key: 'runes', type: 'bool', label: 'Runes' },
      { group: 'Eldritch', key: 'aura', type: 'bool', label: 'Void aura' },
      { group: 'Eldritch', key: 'skeletal', type: 'bool', label: 'Ghost flesh' },
      { group: 'Eldritch', key: 'eldritchColor', type: 'color', label: 'Eldritch colour', options: ELDRITCH },

      { group: `Mutation effects (max ${MAX_EFFECTS})`, key: 'effects', type: 'flags', label: 'Effects',
        options: EFFECT_KEYS.map((k) => [`${EFFECTS[k].icon} ${EFFECTS[k].label}`, k]), max: MAX_EFFECTS },
    ];
    const SCHEMA_BY_KEY = Object.fromEntries(FEATURE_SCHEMA.map((f) => [f.key, f]));

    // ---- breeding ----------------------------------------------------------
    // Genes that travel together, so a child inherits a recognisable tail or
    // dorsal fin from one parent instead of a mash of unrelated numbers. Every
    // other feature is its own gene.
    const GENE_LINKS = [
      ['shape', 'bodyLen', 'bodyDepth', 'peak', 'headBlunt', 'taper', 'backArch'],
      ['tail', 'tailLen', 'tailSpan'],
      ['dorsal', 'dorsalH', 'dorsalStart', 'dorsalEnd', 'dorsalLean'],
      ['anal', 'analH', 'analStart', 'analEnd'],
      ['pattern', 'patternCount', 'patternSeed'],
      ['barbels', 'barbelLen'],
      ['tentacles', 'tentacleLen'],
    ];
    // Cross two fish of the same habitat. Each gene group comes from one
    // parent; within it a number may land anywhere between the two parents and
    // a colour may blend. A `mutation` share of genes is taken instead from a
    // fresh fish of the habitat, so mutations stay native to it. Deterministic:
    // the same parents + seedStr always give the same child. Returns the child
    // and, per feature, where it came from ('A' | 'B' | 'mix' | 'mut').
    // Mutation effects for a child, from their own stream so they never shift
    // the gene rolls. Each effect a parent carries passes on 35% of the time
    // (65% if both carry it); then fresh effects roll, each one rarer than the
    // last: effectChance for the first, then EFFECT_STACK. Weighted by
    // EFFECTS[k].weight, capped at MAX_EFFECTS. Returns { effects, fresh }.
    function rollEffects(a, b, seedStr, habitat, effectChance) {
      const rng = makePRNG(`effects|${habitat}|${seedStr}`), effects = [], fresh = [];
      for (const k of EFFECT_KEYS) {
        const n = hasFx(a, k) + hasFx(b, k), r = rng();
        if (n && r < (n === 2 ? 0.65 : 0.35) && effects.length < MAX_EFFECTS) effects.push(k);
      }
      while (effects.length < MAX_EFFECTS) {
        const odds = effects.length ? EFFECT_STACK[effects.length - 1] : effectChance;
        if (rng() >= odds) break;
        const k = pickW(rng, Object.fromEntries(EFFECT_KEYS.filter((e) => !effects.includes(e)).map((e) => [e, EFFECTS[e].weight])));
        effects.push(k); fresh.push(k);
      }
      return { effects: EFFECT_KEYS.filter((k) => effects.includes(k)), fresh };
    }

    function breedFeatures(a, b, seedStr, habitat = FIRST_HABITAT, config = {}, mutation = 0.05, effectChance = 0.15) {
      const cfg = { ...DEFAULT_FISH_CONFIG, ...config };
      const rng = makePRNG(`breed|${habitat}|${seedStr}`);
      const mutant = featuresFromSeed(`mutant|${seedStr}`, habitat, cfg);
      const linked = new Set(GENE_LINKS.flat());
      const groups = [...GENE_LINKS, ...Object.keys(mutant).filter((k) => !linked.has(k)).map((k) => [k])];
      const child = {}, origin = {};
      for (const group of groups) {
        const fromA = rng() < 0.5;
        for (const key of group) {
          const field = SCHEMA_BY_KEY[key], va = a[key] ?? mutant[key], vb = b[key] ?? mutant[key];
          const rBlend = rng(), t = rng(), rMut = rng(); // always three draws: fixed stream
          let v = fromA ? va : vb, o = fromA ? 'A' : 'B';
          if (va !== vb && field?.type === 'int' && rBlend < 0.4) { v = Math.round(lerp(va, vb, t)); o = 'mix'; }
          else if (va !== vb && field?.type === 'color' && rBlend < 0.3) { v = toHex(mix(hx(va), hx(vb), t)); o = 'mix'; }
          if (rMut < mutation) { v = mutant[key]; o = 'mut'; }
          if (field?.type === 'int') v = clamp(v, field.min, field.max);
          child[key] = v; origin[key] = o;
        }
      }
      child.tailLen = clamp(child.tailLen, 0, 60 - child.bodyLen);
      const { effects, fresh } = rollEffects(a, b, seedStr, habitat, effectChance);
      child.effects = effects;
      return { child, origin, freshEffects: fresh };
    }

    // =======================================================================
    // lab UI
    // =======================================================================
    const $ = (id) => document.getElementById(id);
    const habitatSel = $('habitat'), seedInput = $('seed'), sizeSel = $('size');

    let habitat = Object.keys(HABITATS)[0];
    let scenes = Object.fromEntries(Object.entries(HABITATS).map(([k, h]) => [k, { ...h.scene }])); // working copy
    let config = { ...DEFAULT_FISH_CONFIG };
    let gallerySeeds = freshGallery();
    let customMode = false, breedMode = false;
    let features = null;
    // Breeding pen state. A parent is either seed-derived or a promoted child /
    // creator fish; `hab` pins it to the habitat it was made in, so the pen
    // only ever crosses two fish of the current habitat.
    const parents = { A: null, B: null };
    let mutation = 0.05, effectChance = 0.15, litterSeed = 'litter_1';
    const LITTER = 16;

    function freshGallery() { return Array.from({ length: 48 }, () => 'g_' + Math.floor(Math.random() * 1e9).toString(36)); }
    const cfgFor = (hab) => ({ ...config, scene: scenes[hab] });
    const url = (seed, hab, w) => renderFishDataURL(seed, hab, w, cfgFor(hab));

    for (const [key, h] of Object.entries(HABITATS)) habitatSel.add(new Option(h.label, key));

    function buildConfigControls() {
      const cfg = $('cfg'); cfg.innerHTML = '';
      for (const key of Object.keys(config)) {
        const wrap = document.createElement('div'); wrap.className = 'knob';
        const input = document.createElement('input');
        input.type = 'number'; input.min = 0; input.max = 1; input.step = 0.05; input.value = config[key];
        input.addEventListener('input', () => { const v = parseFloat(input.value); if (!Number.isNaN(v)) { config[key] = v; renderAll(); } });
        const span = document.createElement('span');
        span.textContent = key.replace(/Chance$/, '').replace(/([A-Z])/g, ' $1');
        span.title = key;
        wrap.append(input, span); cfg.appendChild(wrap);
      }
    }
    function buildPaletteControls() {
      const pal = $('palette'); pal.innerHTML = '';
      for (const [key, color] of Object.entries(scenes[habitat])) {
        const row = document.createElement('div'); row.className = 'swatch';
        const input = document.createElement('input'); input.type = 'color'; input.value = color;
        input.addEventListener('input', () => { scenes[habitat][key] = input.value; renderAll(); });
        const span = document.createElement('span'); span.textContent = key;
        row.append(input, span); pal.appendChild(row);
      }
    }

    function makeCell(seed, hab, w, cap) {
      const cell = document.createElement('div'); cell.className = 'cell';
      const img = document.createElement('img');
      img.width = w; img.height = Math.round(w * FISH_H / FISH_W);
      img.src = url(seed, hab, w); img.title = `${HABITATS[hab].label} · ${seed}`;
      img.addEventListener('click', () => { habitat = hab; habitatSel.value = hab; seedInput.value = seed; buildPaletteControls(); renderAll(); });
      cell.appendChild(img);
      if (cap) { const c = document.createElement('div'); c.className = 'cap'; c.textContent = cap; cell.appendChild(c); }
      return cell;
    }
    function gridOf(items) {
      const grid = document.createElement('div'); grid.className = 'grid';
      for (const it of items) grid.appendChild(makeCell(it.seed, it.hab, it.w, it.cap));
      return grid;
    }
    function section(title, node) { const h = document.createElement('h2'); h.textContent = title; $('main').append(h, node); }

    // ---- creator ----
    const fieldGet = (field) => (field.get ? field.get(features) : features[field.key]);
    const fieldSet = (field, v) => {
      field.set ? field.set(features, v) : (features[field.key] = v);
      field.rebuild ? renderCreator() : updateCreatorPreview();
    };
    const normOpts = (field) => field.options.map((o) => (Array.isArray(o) ? o : [o, o]));
    const mkBtn = (text, onClick) => { const b = document.createElement('button'); b.textContent = text; b.addEventListener('click', onClick); return b; };

    function buildFieldControl(field) {
      const wrap = document.createElement('div'); wrap.className = 'cfield';
      const lab = document.createElement('label'); lab.textContent = field.label; wrap.appendChild(lab);
      if (field.type === 'bool') {
        const input = document.createElement('input'); input.type = 'checkbox'; input.checked = !!fieldGet(field);
        input.addEventListener('change', () => fieldSet(field, input.checked));
        wrap.appendChild(input);
      } else if (field.type === 'int') {
        const input = document.createElement('input'); input.type = 'number';
        input.min = field.min; input.max = field.max; input.step = 1; input.value = fieldGet(field);
        input.addEventListener('input', () => { const v = parseInt(input.value, 10); if (!Number.isNaN(v)) fieldSet(field, clamp(v, field.min, field.max)); });
        wrap.appendChild(input);
      } else if (field.type === 'color') {
        const row = document.createElement('div'); row.className = 'color-row';
        const input = document.createElement('input'); input.type = 'color'; input.value = fieldGet(field) || '#888888';
        input.addEventListener('input', () => fieldSet(field, input.value));
        const presets = document.createElement('div'); presets.className = 'presets';
        for (const c of field.options || []) {
          const b = document.createElement('button'); b.style.background = c; b.title = c;
          b.addEventListener('click', () => { input.value = c; fieldSet(field, c); });
          presets.appendChild(b);
        }
        row.append(input, presets); wrap.appendChild(row);
      } else if (field.type === 'enum') {
        const sel = document.createElement('select'), opts = normOpts(field);
        opts.forEach(([label], i) => sel.add(new Option(label, String(i))));
        const idx = opts.findIndex(([, v]) => v === fieldGet(field));
        sel.value = String(idx < 0 ? 0 : idx);
        sel.addEventListener('change', () => fieldSet(field, opts[Number(sel.value)][1]));
        wrap.appendChild(sel);
      } else if (field.type === 'flags') { // checkbox set, at most field.max ticked
        wrap.classList.add('flags');
        const boxes = [];
        const sync = () => { const n = boxes.filter((b) => b.checked).length; for (const b of boxes) b.disabled = !b.checked && n >= field.max; };
        for (const [label, v] of normOpts(field)) {
          const row = document.createElement('label'); row.className = 'flag';
          const box = document.createElement('input'); box.type = 'checkbox'; box.value = v;
          box.checked = (fieldGet(field) || []).includes(v);
          box.addEventListener('change', () => { sync(); fieldSet(field, normOpts(field).map(([, k]) => k).filter((k) => boxes.find((b) => b.value === k).checked)); });
          boxes.push(box); row.append(box, label); wrap.appendChild(row);
        }
        sync();
      }
      return wrap;
    }

    const animBuf = document.createElement('canvas'); animBuf.width = FISH_W; animBuf.height = FISH_H;
    function paintCreator(anim) {
      const canvas = $('creator-canvas'); if (!canvas) return;
      drawFishFeatures(animBuf.getContext('2d'), features, habitat, cfgFor(habitat), anim);
      const cctx = canvas.getContext('2d'); cctx.imageSmoothingEnabled = false;
      cctx.clearRect(0, 0, canvas.width, canvas.height);
      cctx.drawImage(animBuf, 0, 0, canvas.width, canvas.height);
    }
    function updateCreatorPreview() { if (!animOn) paintCreator(null); }

    // ~12fps is plenty for pixel art and keeps CPU low.
    let animOn = false, animRAF = 0, animLast = 0;
    function animTick(t) {
      if (!animOn) return;
      if (t - animLast >= 83) { animLast = t; paintCreator(fishAnim(t, 7.3)); }
      animRAF = requestAnimationFrame(animTick);
    }
    function setAnim(on) {
      animOn = on;
      if (on) { animLast = 0; animRAF = requestAnimationFrame(animTick); }
      else { cancelAnimationFrame(animRAF); paintCreator(null); }
    }

    function loadFeatures(seed) { features = featuresFromSeed(seed, habitat, config); }

    function renderCreator() {
      const main = $('main'); main.innerHTML = '';
      if (!features) loadFeatures(seedInput.value || 'fish_1000');
      const wrap = document.createElement('div'); wrap.className = 'creator';
      const col = document.createElement('div');
      const canvas = document.createElement('canvas'); canvas.id = 'creator-canvas'; canvas.width = 512; canvas.height = 384;
      col.appendChild(canvas);
      const btns = document.createElement('div'); btns.className = 'btn-row';
      const jsonOut = document.createElement('textarea'); jsonOut.id = 'json-out'; jsonOut.readOnly = true; jsonOut.style.height = '90px';
      btns.append(
        mkBtn('⤵ Load seed', () => { loadFeatures(seedInput.value || 'fish_1000'); renderCreator(); }),
        mkBtn('🎲 Randomize', () => { loadFeatures('rand_' + Math.random().toString(36).slice(2)); renderCreator(); }),
        mkBtn(animOn ? '⏸ Stop' : '▶ Swim', (e) => { setAnim(!animOn); e.target.textContent = animOn ? '⏸ Stop' : '▶ Swim'; }),
        mkBtn('Copy JSON', async () => { jsonOut.value = JSON.stringify(features); jsonOut.style.display = 'block'; try { await navigator.clipboard.writeText(jsonOut.value); } catch { /* shown in textarea */ } }),
        mkBtn('🧬 → Parent A', () => { setParent('A', structuredClone(features), 'from creator', 0); setMode('breed'); }),
        mkBtn('🧬 → Parent B', () => { setParent('B', structuredClone(features), 'from creator', 0); setMode('breed'); }),
      );
      col.append(btns, jsonOut);
      wrap.appendChild(col);
      const groupsWrap = document.createElement('div'); groupsWrap.className = 'creator-groups';
      const order = [], byGroup = new Map();
      for (const field of FEATURE_SCHEMA) {
        if (!byGroup.has(field.group)) { byGroup.set(field.group, []); order.push(field.group); }
        byGroup.get(field.group).push(field);
      }
      for (const g of order) {
        const sect = document.createElement('div');
        const title = document.createElement('div'); title.className = 'cgroup-title'; title.textContent = g;
        const grid = document.createElement('div'); grid.className = 'creator-controls';
        for (const field of byGroup.get(g)) grid.appendChild(buildFieldControl(field));
        sect.append(title, grid); groupsWrap.appendChild(sect);
      }
      wrap.appendChild(groupsWrap);
      section('Fish creator', wrap);
      updateCreatorPreview();
    }

    // ---- breeding pen ----
    function setParent(slot, feats, label, gen, seed = null) { parents[slot] = { features: feats, label, gen, seed, hab: habitat }; }
    function seedParent(slot, seed) { setParent(slot, featuresFromSeed(seed, habitat, config), seed, 0, seed); }
    function ensureParents() {
      if (parents.A?.hab !== habitat) seedParent('A', parents.A?.seed || 'fish_1000');
      if (parents.B?.hab !== habitat) seedParent('B', parents.B?.seed || 'fish_2000');
    }
    const featImg = (feats, w) => {
      const img = document.createElement('img');
      img.width = w; img.height = Math.round(w * FISH_H / FISH_W);
      img.src = renderFishFeaturesDataURL(feats, habitat, w, cfgFor(habitat));
      const rar = RARITY[fxList(feats).length];
      if (rar.color) { img.style.borderColor = rar.color; img.style.boxShadow = `0 0 6px ${rar.color}`; }
      return img;
    };
    // "✨❄️ Epic" — the effect icons plus the rarity tier their count earns.
    const fxBadge = (feats) => {
      const fx = fxList(feats);
      return fx.length ? `${fx.map((k) => EFFECTS[k].icon).join('')} ${RARITY[fx.length].name}` : '';
    };
    const fxBadgeEl = (feats) => {
      const d = document.createElement('div'); d.className = 'fx'; d.textContent = fxBadge(feats);
      const rar = RARITY[fxList(feats).length]; if (rar.color) d.style.color = rar.color;
      d.title = fxList(feats).map((k) => EFFECTS[k].label).join(' + ');
      return d;
    };

    function parentCard(slot) {
      const p = parents[slot], card = document.createElement('div'); card.className = 'parent';
      const title = document.createElement('div'); title.className = 'ptitle'; title.textContent = `Parent ${slot}`;
      const row = document.createElement('div'); row.className = 'seed-row';
      const input = document.createElement('input'); input.type = 'text'; input.spellcheck = false;
      input.value = p.seed ?? ''; input.placeholder = 'seed';
      input.addEventListener('change', () => { if (input.value) { seedParent(slot, input.value); renderBreeding(); } });
      row.append(input, mkBtn('🎲', () => { seedParent(slot, 'fish_' + Math.floor(Math.random() * 1e9).toString(36)); renderBreeding(); }));
      const label = document.createElement('div'); label.className = 'plabel';
      label.textContent = p.gen ? `Gen ${p.gen} · ${p.label}` : p.label;
      card.append(title, featImg(p.features, 256), row, label, fxBadgeEl(p.features));
      return card;
    }

    function litterCell(k) {
      const { child, origin, freshEffects } = breedFeatures(parents.A.features, parents.B.features, `${litterSeed}#${k}`, habitat, config, mutation, effectChance);
      const gen = Math.max(parents.A.gen, parents.B.gen) + 1, name = `#${k}`;
      const counts = { A: 0, B: 0, mix: 0, mut: 0 };
      for (const o of Object.values(origin)) counts[o]++;
      const cell = document.createElement('div'); cell.className = 'cell';
      const img = featImg(child, Number(sizeSel.value));
      img.title = `Gen ${gen} ${name}\nfrom A: ${counts.A} · from B: ${counts.B} · blended: ${counts.mix} · mutated: ${counts.mut}`
        + (counts.mut ? `\nmutations: ${Object.keys(origin).filter((g) => origin[g] === 'mut').join(', ')}` : '')
        + (child.effects.length ? `\neffects (${RARITY[child.effects.length].name}): ${child.effects.map((e) => EFFECTS[e].label + (freshEffects.includes(e) ? ' (new)' : ' (inherited)')).join(', ')}` : '');
      const acts = document.createElement('div'); acts.className = 'acts';
      acts.append(
        mkBtn('→A', () => { setParent('A', child, `child ${name}`, gen); renderBreeding(); }),
        mkBtn('→B', () => { setParent('B', child, `child ${name}`, gen); renderBreeding(); }),
        mkBtn('✎', () => { features = structuredClone(child); setMode('custom'); }),
      );
      const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = `${name} · A${counts.A} B${counts.B} ~${counts.mix}${counts.mut ? ` ⚡${counts.mut}` : ''}`;
      cell.append(img, cap, fxBadgeEl(child), acts);
      return cell;
    }

    function renderBreeding() {
      $('main').innerHTML = '';
      ensureParents();
      const pen = document.createElement('div'); pen.className = 'pen';
      const cross = document.createElement('div'); cross.className = 'cross'; cross.textContent = '×';
      const controls = document.createElement('div'); controls.className = 'pen-controls';
      const mLab = document.createElement('label'); mLab.textContent = 'Mutation rate (0–1)';
      const mIn = document.createElement('input'); mIn.type = 'number'; mIn.min = 0; mIn.max = 1; mIn.step = 0.01; mIn.value = mutation;
      mIn.addEventListener('change', () => { const v = parseFloat(mIn.value); if (!Number.isNaN(v)) { mutation = clamp(v, 0, 1); renderBreeding(); } });
      const eLab = document.createElement('label'); eLab.textContent = 'Effect chance (0–1)';
      const eIn = document.createElement('input'); eIn.type = 'number'; eIn.min = 0; eIn.max = 1; eIn.step = 0.05; eIn.value = effectChance;
      eIn.title = `Chance of a first new effect; after that, ${EFFECT_STACK[0] * 100}% for a 2nd and ${EFFECT_STACK[1] * 100}% for a 3rd`;
      eIn.addEventListener('change', () => { const v = parseFloat(eIn.value); if (!Number.isNaN(v)) { effectChance = clamp(v, 0, 1); renderBreeding(); } });
      controls.append(mLab, mIn, eLab, eIn,
        mkBtn('🎲 New litter', () => { litterSeed = 'litter_' + Math.random().toString(36).slice(2); renderBreeding(); }),
        mkBtn('⇄ Swap parents', () => { [parents.A, parents.B] = [parents.B, parents.A]; renderBreeding(); }));
      pen.append(parentCard('A'), cross, parentCard('B'), controls);
      section(`Breeding pen · ${HABITATS[habitat].label}`, pen);
      const hint = document.createElement('div'); hint.className = 'hint';
      hint.textContent = 'Caption: genes from A / B / ~blended / ⚡mutated (hover a child for detail). →A / →B promotes a child to parent; ✎ opens it in the creator. '
        + `Effects: ${EFFECT_KEYS.map((k) => `${EFFECTS[k].icon} ${EFFECTS[k].label}`).join(' · ')}. `
        + 'Up to 3 per fish (1 Rare, 2 Epic, 3 Legendary); parents pass theirs on 35% of the time each (65% if both carry it).';
      $('main').append(hint);
      const grid = document.createElement('div'); grid.className = 'grid';
      for (let k = 0; k < LITTER; k++) grid.appendChild(litterCell(k));
      section('Litter', grid);
    }

    // One view at a time: gallery, creator ('custom') or breeding pen ('breed').
    function setMode(mode) {
      customMode = mode === 'custom'; breedMode = mode === 'breed';
      $('custom-toggle').checked = customMode; $('breed-toggle').checked = breedMode;
      if (!customMode && animOn) setAnim(false);
      renderAll();
    }

    function renderAll() {
      if (customMode) { renderCreator(); return; }
      if (breedMode) { renderBreeding(); return; }
      $('main').innerHTML = '';
      const seed = seedInput.value || 'fish_1000', w = Number(sizeSel.value);

      section('Preview', gridOf(Object.keys(HABITATS).map((hab) => ({ seed, hab, w: 256, cap: HABITATS[hab].label }))));
      const fd = document.createElement('div'); fd.className = 'feat';
      const feat = featuresFromSeed(seed, habitat, config);
      fd.textContent = `${HABITATS[habitat].label}\n` + Object.entries(feat).map(([k, v]) => `${k}: ${v}`).join('\n');
      $('main').append(fd);

      const baseSeed = seed.replace(/#\d+$/, '');
      section('Seed variants (picker preview)',
        gridOf(Array.from({ length: 32 }, (_, k) => ({ seed: `${baseSeed}#${k}`, hab: habitat, w, cap: '#' + k }))));
      section('Variety gallery', gridOf(gallerySeeds.map((s) => ({ seed: s, hab: habitat, w }))));
    }

    function exportSnippet() {
      const sc = Object.entries(scenes[habitat]).map(([k, v]) => `${k}: '${v}'`).join(', ');
      const cfg = Object.entries(config).map(([k, v]) => `  ${k}: ${v},`).join('\n');
      return `// HABITATS.${habitat}.scene\nscene: { ${sc} },\n\n// DEFAULT_FISH_CONFIG\n{\n${cfg}\n}`;
    }

    $('custom-toggle').addEventListener('change', (e) => setMode(e.target.checked ? 'custom' : 'gallery'));
    $('breed-toggle').addEventListener('change', (e) => setMode(e.target.checked ? 'breed' : 'gallery'));
    habitatSel.addEventListener('change', () => { habitat = habitatSel.value; buildPaletteControls(); renderAll(); });
    seedInput.addEventListener('input', renderAll);
    sizeSel.addEventListener('change', renderAll);
    $('roll').addEventListener('click', () => { seedInput.value = 'fish_' + Math.floor(Math.random() * 1e9).toString(36); renderAll(); });
    $('reshuffle').addEventListener('click', () => { gallerySeeds = freshGallery(); renderAll(); });
    $('reset').addEventListener('click', () => {
      scenes = Object.fromEntries(Object.entries(HABITATS).map(([k, h]) => [k, { ...h.scene }]));
      config = { ...DEFAULT_FISH_CONFIG };
      buildConfigControls(); buildPaletteControls(); renderAll();
    });
    $('export').addEventListener('click', async () => {
      const out = $('export-out');
      out.value = exportSnippet(); out.style.display = 'block';
      try { await navigator.clipboard.writeText(out.value); } catch { /* textarea still shows it */ }
    });

    habitatSel.value = habitat;
    buildConfigControls();
    buildPaletteControls();
    renderAll();
  </script>
</body>
</html>
