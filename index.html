<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #12181c; color: #d3dde0;
      font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px;
      display: flex; min-height: 100vh;
    }
    #sidebar {
      width: 440px; flex-shrink: 0; background: #182024;
      border-right: 1px solid #27333a; padding: 16px;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    #sidebar h1 { font-size: 16px; margin: 0 0 12px; color: #5fd4e0; }
    .control { margin-bottom: 14px; }
    .control > label { display: block; margin-bottom: 4px; color: #85969c; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    select, input[type="text"], input[type="number"] {
      background: #212b30; color: #d3dde0; border: 1px solid #334249;
      border-radius: 4px; padding: 6px 8px; font-size: 14px;
    }
    select, input[type="text"] { width: 100%; }
    .seed-row { display: flex; gap: 6px; }
    .seed-row input { flex: 1; }
    button {
      background: #24363d; color: #d3dde0; border: 1px solid #36505a;
      border-radius: 4px; padding: 7px 12px; cursor: pointer; font-size: 13px;
    }
    button:hover { background: #2e4650; }
    #cfg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
    .knob { display: flex; align-items: center; gap: 6px; }
    .knob input { width: 62px; }
    .knob span { font-size: 11px; color: #a3b2b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #palette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; }
    .swatch { display: flex; align-items: center; gap: 6px; }
    .swatch input[type="color"] { width: 28px; height: 24px; padding: 0; border: 1px solid #334249; border-radius: 4px; background: none; cursor: pointer; flex-shrink: 0; }
    .swatch span { font-size: 12px; color: #a3b2b8; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    #export-out, #json-out {
      width: 100%; height: 200px; margin-top: 10px; background: #0f1416;
      color: #8fd4a0; border: 1px solid #27333a; border-radius: 4px;
      font-family: Consolas, monospace; font-size: 11px; white-space: pre; display: none;
    }
    .hint { color: #66777d; font-size: 11px; margin-top: 4px; }
    #main { flex: 1; padding: 15px 20px; }
    h2 { font-size: 14px; color: #85969c; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #27333a; padding-bottom: 6px; margin: 26px 0 14px; }
    h2:first-child { margin-top: 0; }
    .feat { font-size: 11px; color: #7eadb0; margin-top: 10px; line-height: 1.5; font-family: Consolas, monospace; columns: 3 200px; }
    .grid { display: flex; flex-wrap: wrap; gap: 10px; max-width: 1100px; }
    .grid .cell { text-align: center; }
    .grid img { image-rendering: pixelated; border-radius: 4px; border: 1px solid #27333a; display: block; cursor: pointer; }
    .grid .cap { font-size: 10px; color: #66777d; margin-top: 3px; }
    .grid img:hover { border-color: #5fd4e0; }
    .toggle-row { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; }
    .toggle-row input { width: 18px; height: 18px; }
    .toggle-row label { cursor: pointer; color: #5fd4e0; font-size: 13px; }
    .creator { display: flex; gap: 26px; align-items: flex-start; flex-wrap: wrap; }
    .creator canvas { image-rendering: pixelated; border-radius: 8px; border: 1px solid #27333a; display: block; }
    .creator .btn-row { max-width: 512px; }
    .creator-groups { display: flex; flex-direction: column; flex: 1; min-width: 320px; max-width: 600px; }
    .ctabs { display: flex; flex-wrap: wrap; gap: 3px; border-bottom: 1px solid #334249; margin-bottom: 12px; }
    .ctab { background: none; border: 1px solid transparent; border-bottom: none; border-radius: 5px 5px 0 0;
      padding: 6px 10px; margin-bottom: -1px; color: #85969c; font-size: 12px; }
    .ctab:hover { background: #1e282c; color: #c3d0d4; }
    .ctab.active { background: #212b30; border-color: #334249; color: #5fd4e0; font-weight: bold; }
    .creator-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px 18px; max-width: 560px; }
    .cfield { display: flex; flex-direction: column; gap: 3px; }
    .cfield > label { font-size: 11px; color: #85969c; text-transform: uppercase; letter-spacing: 0.4px; }
    .cfield select, .cfield input[type="number"] { width: 100%; }
    .cfield input[type="checkbox"] { align-self: flex-start; margin: 2px 0 0; width: 16px; height: 16px; }
    .color-row { display: flex; align-items: center; gap: 5px; }
    .color-row input[type="color"] { width: 34px; height: 34px; padding: 0; border: 1px solid #334249; border-radius: 4px; background: none; cursor: pointer; flex-shrink: 0; }
    .presets { display: flex; gap: 3px; flex-wrap: wrap; }
    .presets button { width: 15px; height: 15px; padding: 0; border-radius: 3px; border: 1px solid #334249; cursor: pointer; }
    .pen { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; }
    .parent { display: flex; flex-direction: column; gap: 6px; width: 256px; }
    .parent .ptitle { font-size: 11px; font-weight: bold; color: #5fd4e0; text-transform: uppercase; letter-spacing: 1px; }
    .parent img { image-rendering: pixelated; border-radius: 6px; border: 1px solid #27333a; display: block; }
    .parent .plabel { font-size: 11px; color: #7eadb0; font-family: Consolas, monospace; }
    .cross { font-size: 28px; color: #5fd4e0; align-self: center; }
    .pen-controls { display: flex; flex-direction: column; gap: 8px; }
    .pen-controls label { font-size: 11px; color: #85969c; text-transform: uppercase; letter-spacing: 0.4px; }
    .grid .acts { display: flex; gap: 3px; justify-content: center; margin-top: 3px; }
    .grid .acts button { padding: 2px 6px; font-size: 11px; }
    .notice { font-size: 12px; color: #ffcf6a; margin: 8px 0; }
    .fx { font-size: 11px; font-weight: bold; min-height: 15px; margin-top: 2px; }
    .cfield.flags { grid-column: 1 / -1; gap: 6px; align-items: flex-start; } /* one effect per row */
    .flag { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #c3d0d4; cursor: pointer; }
    .flag input[type="checkbox"] { margin: 0; align-self: center; }
    .flag:has(input:disabled) { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>🐟 Fish Lab</h1>

    <div class="toggle-row">
      <input type="checkbox" id="custom-toggle">
      <label for="custom-toggle">🎨 Custom fish (edit features)</label>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="breed-toggle">
      <label for="breed-toggle">🧬 Breeding pen (cross two fish)</label>
    </div>

    <div class="control">
      <label for="habitat">Habitat</label>
      <select id="habitat"></select>
    </div>

    <div class="control">
      <label for="species">Species</label>
      <select id="species"></select>
      <div class="hint">"Habitat mix" lets each seed's habitat decide; only the same species can breed.</div>
    </div>

    <div class="control">
      <label for="seed">Seed</label>
      <div class="seed-row">
        <input type="text" id="seed" value="fish_1000" spellcheck="false">
        <button id="roll">🎲</button>
      </div>
      <div class="hint">Same seed + habitat always renders the same fish.</div>
    </div>

    <div class="control">
      <label for="size">Gallery cell width</label>
      <select id="size">
        <option value="96">96 px</option>
        <option value="128" selected>128 px</option>
        <option value="192">192 px</option>
      </select>
    </div>

    <div class="control">
      <label>Config knobs (0–1)</label>
      <div id="cfg"></div>
    </div>

    <div class="control">
      <label>Habitat scene palette</label>
      <div id="palette"></div>
    </div>

    <div class="btn-row">
      <button id="reset">Reset</button>
      <button id="reshuffle">Reshuffle gallery</button>
      <button id="export">Export palette + config</button>
    </div>
    <textarea id="export-out" readonly spellcheck="false"></textarea>
    <div class="hint">Paste the scene into HABITATS.&lt;habitat&gt;.scene and the config into DEFAULT_FISH_CONFIG.</div>
  </div>

  <div id="main"></div>

  <script type="module">
    // =======================================================================
    // fishGen — procedural, seeded side-view pixel fish.
    //
    // Self-contained: no imports. To reuse in another project, lift this block
    // (down to the "lab UI" banner) into fishGen.js and add `export` to the
    // public API at the bottom of it.
    //
    // Same recipe as the avatar portraits: a stable string -> PRNG, every
    // feature rolled up front in a FIXED order into a plain `feat` object, then
    // drawing reads only that object. Fixed-order rolling means turning a
    // config knob down removes just its own feature instead of reshuffling the
    // rest of the fish, and the feature object doubles as the creator's save
    // format. Authored on a 64x48 logical grid, nearest-neighbour upscaled.
    // =======================================================================

    const FISH_W = 64, FISH_H = 48;

    // ---- PRNG (xmur3 string hash -> mulberry32) ----------------------------
    function xmur3(str) {
      let h = 1779033703 ^ str.length;
      for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
      return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
    }
    function mulberry32(a) {
      return () => {
        a |= 0; a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const makePRNG = (s) => mulberry32(xmur3(s)());
    const ri = (rng, min, max) => min + Math.floor(rng() * (max - min + 1));
    const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
    // Weighted pick from { key: weight } — always consumes exactly one draw.
    function pickW(rng, weights) {
      const entries = Object.entries(weights).filter(([, w]) => w > 0);
      let r = rng() * entries.reduce((s, [, w]) => s + w, 0);
      for (const [k, w] of entries) { if ((r -= w) < 0) return k; }
      return entries[entries.length - 1][0];
    }
    const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
    const lerp = (a, b, t) => a + (b - a) * t;
    const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
    // Position hash for texture — independent of the rng stream.
    function hash(x, y) { const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return n - Math.floor(n); }
    function noise(x, y) { // bilinear value noise, 0..1
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return lerp(lerp(hash(xi, yi), hash(xi + 1, yi), u), lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), u), v);
    }

    // ---- colour (internally [r,g,b]; hex only at the edges) ----------------
    const _hex = new Map();
    function hx(hex) {
      let c = _hex.get(hex);
      if (!c) { const n = parseInt(hex.slice(1), 16); c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; _hex.set(hex, c); }
      return c;
    }
    const toHex = (c) => '#' + c.map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
    const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
    const sh = (c, f) => [c[0] * f, c[1] * f, c[2] * f];
    const luma = (c) => 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
    const WHITE = [250, 250, 244], PUPIL = [12, 10, 14], MOUTH = [26, 14, 16], BONE = [232, 228, 210], GULLET = [40, 6, 14];

    // ---- tiny RGBA raster (alpha-blended plots, no canvas needed) ----------
    const raster = () => new Uint8ClampedArray(FISH_W * FISH_H * 4);
    function plot(R, x, y, c, a = 1) {
      x = Math.floor(x); y = Math.floor(y);
      if (x < 0 || y < 0 || x >= FISH_W || y >= FISH_H || a <= 0) return;
      const i = (y * FISH_W + x) * 4;
      if (a >= 1) { R[i] = c[0]; R[i + 1] = c[1]; R[i + 2] = c[2]; R[i + 3] = 255; return; }
      const da = R[i + 3] / 255, oa = a + da * (1 - a), k = da * (1 - a);
      R[i] = (c[0] * a + R[i] * k) / oa; R[i + 1] = (c[1] * a + R[i + 1] * k) / oa; R[i + 2] = (c[2] * a + R[i + 2] * k) / oa;
      R[i + 3] = oa * 255;
    }
    function darken(R, x, y, f) {
      if (x < 0 || y < 0 || x >= FISH_W || y >= FISH_H) return;
      const i = (y * FISH_W + x) * 4;
      if (R[i + 3]) { R[i] *= f; R[i + 1] *= f; R[i + 2] *= f; }
    }
    function disc(R, cx, cy, r, c, a = 1) {
      for (let dy = -r; dy <= r; dy++) {
        const dx = Math.floor(Math.sqrt(r * r - dy * dy) + 0.25);
        for (let x = cx - dx; x <= cx + dx; x++) plot(R, x, cy + dy, c, a);
      }
    }
    // Darken every opaque pixel that touches transparency: a crisp 1px inner
    // outline, done per layer so fins and body each keep their own contour.
    function edgeDarken(R, f = 0.6) {
      const solid = (x, y) => x >= 0 && y >= 0 && x < FISH_W && y < FISH_H && R[(y * FISH_W + x) * 4 + 3] >= 128;
      const edges = [];
      for (let y = 0; y < FISH_H; y++) for (let x = 0; x < FISH_W; x++) {
        if (solid(x, y) && (!solid(x - 1, y) || !solid(x + 1, y) || !solid(x, y - 1) || !solid(x, y + 1))) edges.push(x, y);
      }
      for (let i = 0; i < edges.length; i += 2) darken(R, edges[i], edges[i + 1], f);
    }
    function over(dst, src) { // src composited over dst, in place
      for (let i = 0; i < dst.length; i += 4) {
        const a = src[i + 3] / 255;
        if (a) plot(dst, (i / 4) % FISH_W, Math.floor(i / 4 / FISH_W), [src[i], src[i + 1], src[i + 2]], a);
      }
    }

    // ---- tables ------------------------------------------------------------
    // Body shape presets. Ranges are [min, max]; peak/taper/arch are percents.
    //   peak  = where the body is deepest (% from the snout)
    //   blunt = head roundness 1 (bulbous) .. 5 (pointed)
    //   taper = peduncle depth as % of max depth
    //   arch  = % of depth above the centreline (back vs belly)
    const SHAPES = {
      torpedo: { len: [38, 44], depth: [13, 17], peak: [30, 42], blunt: [2, 4], taper: [14, 22], arch: [52, 58] },
      deep:    { len: [28, 34], depth: [22, 28], peak: [38, 50], blunt: [2, 4], taper: [12, 20], arch: [50, 56] },
      round:   { len: [28, 34], depth: [19, 24], peak: [42, 55], blunt: [1, 2], taper: [16, 24], arch: [50, 55] },
      long:    { len: [48, 52], depth: [6, 8],   peak: [15, 28], blunt: [2, 4], taper: [45, 65], arch: [50, 54] },
      slender: { len: [42, 48], depth: [8, 11],  peak: [30, 48], blunt: [3, 5], taper: [24, 34], arch: [50, 56] },
    };
    // Caudal fin presets: length in px, span as a fraction of body depth.
    const TAILS = {
      forked:   { len: [8, 12],  span: [0.5, 0.75] },
      lunate:   { len: [7, 10],  span: [0.6, 0.85] },
      truncate: { len: [6, 9],   span: [0.4, 0.6] },
      rounded:  { len: [6, 10],  span: [0.4, 0.6] },
      pointed:  { len: [5, 9],   span: [0.3, 0.5] },
      veil:     { len: [11, 16], span: [0.7, 1.0] },
      tentacles: { len: [9, 14], span: [0.4, 0.7] }, // eldritch: writhing arms instead of a fin
      heterocercal: { len: [10, 14], span: [0.6, 0.8] }, // shark: long upper lobe
      fluke: { len: [8, 12], span: [0.5, 0.6] },          // whale: horizontal flukes, seen edge-on
    };
    const DORSALS = ['none', 'rounded', 'swept', 'spiny', 'sail', 'double', 'long', 'shark', 'hump'];
    const ANALS = ['none', 'rounded', 'swept', 'long'];
    const PATTERNS = ['none', 'bands', 'hstripes', 'spots', 'blotch', 'reticulate', 'split', 'starry'];
    // Eldritch accent colours: runes, auras, extra irises.
    const ELDRITCH = ['#7affd0', '#b07aff', '#d8ff6a', '#ff4a6a', '#5af0ff', '#ff9a3a'];

    // Habitats are the "theme" (like the avatar factions): a scene palette the
    // lab can edit, plus the colour pools and weights that bias what grows there.
    // `mods` multiply the matching config chances (0 = never in this habitat);
    // `mods.eldritch` scales every Lovecraftian feature at once, so the weirdness
    // climbs as you go deeper. Scene extras: rays (light shafts), snow (drifting
    // specks), stars (twinkling points), nebula (cloudy glow in scene.light).
    const HABITATS = {
      pond: {
        label: 'Pond',
        scene: { bg1: '#4a7a6a', bg2: '#122a26', light: '#e0f4d8', bubble: '#e4f6ee', speck: '#9ac0a8' },
        rays: 0.8, snow: 0.3,
        shapes: { round: 3, torpedo: 3, deep: 1, slender: 0.5, long: 0.3 },
        tails: { veil: 4, forked: 3, rounded: 2, truncate: 1, lunate: 0.3, pointed: 0.2 },
        dorsals: { rounded: 4, sail: 1.5, long: 1, swept: 1, spiny: 0.3, none: 1, double: 0.3 },
        patterns: { blotch: 5, none: 2, spots: 1.5, split: 1.5, bands: 0.5, reticulate: 1.5, hstripes: 0.3 },
        body: ['#f4f0e8', '#ff7a2a', '#e8b030', '#d8342a', '#1c1a1e', '#f2d6a8', '#ffb070'],
        pattern: ['#ff6a1a', '#d8342a', '#1c1a1e', '#f4f0e8', '#e8b030'],
        fin: ['#f4f0e8', '#ff9a50', '#ffffff', '#e8b030', '#1c1a1e'],
        eye: ['#1c1a1e', '#e8c24a', '#c84a2a'],
        glow: ['#e0f4d8'],
        mods: { lure: 0, photophore: 0, barbel: 1.2, teeth: 0, bigEye: 0.4, lips: 2.5, eldritch: 0.03 },
      },
      river: {
        label: 'River',
        scene: { bg1: '#6f8f5c', bg2: '#1f2c1c', light: '#e8f0c0', bubble: '#e9f2d8', speck: '#a7b98a' },
        rays: 0.6, snow: 0.5,
        shapes: { torpedo: 5, deep: 1, round: 1, long: 1, slender: 3 },
        tails: { forked: 4, truncate: 3, rounded: 2, lunate: 0.5, pointed: 0.6, veil: 0.2 },
        dorsals: { rounded: 4, swept: 2, spiny: 3, sail: 0.5, double: 1.5, long: 0.6 },
        patterns: { none: 3, spots: 4, hstripes: 2, bands: 2, blotch: 2, reticulate: 1, split: 0.5 },
        body: ['#8a9a5b', '#a7a9a2', '#6b5a3a', '#c7c2b0', '#4f6b4a', '#9a7a4a', '#cfd6d8', '#5e6f7a'],
        pattern: ['#2b2a1e', '#3d4a2a', '#1e2622', '#e0a040', '#c74a3a'],
        fin: ['#c2843a', '#8a9a5b', '#d96a3a', '#6b5a3a', '#cfd6d8'],
        eye: ['#e8c24a', '#f0e6c0', '#c8a060'],
        glow: ['#e8f0c0'],
        mods: { lure: 0, photophore: 0, barbel: 1.4, teeth: 0.5, bigEye: 0.5, lips: 0.3, eldritch: 0.05 },
      },
      lake: {
        label: 'Lake',
        scene: { bg1: '#4f7f8f', bg2: '#0f2430', light: '#d8eef0', bubble: '#e0f0f4', speck: '#8fb0b8' },
        rays: 0.7, snow: 0.5,
        shapes: { torpedo: 4, slender: 2, deep: 1.5, round: 1, long: 0.5 },
        tails: { forked: 3, truncate: 3, rounded: 1.5, lunate: 0.5, pointed: 0.3, veil: 0.2 },
        dorsals: { spiny: 3, double: 3, rounded: 3, swept: 1, sail: 0.3, long: 0.3 },
        patterns: { bands: 3, spots: 3, none: 2, hstripes: 1, blotch: 1, reticulate: 0.5 },
        body: ['#6f8a4a', '#c8b04a', '#a8b4b0', '#4a6a5a', '#8a7a5a', '#5a7080', '#b8c4c0'],
        pattern: ['#1e2a1e', '#2a3a2a', '#d8603a', '#e8d070', '#3a3020'],
        fin: ['#d8603a', '#c8b04a', '#6f8a4a', '#a8b4b0', '#3a3020'],
        eye: ['#e8c24a', '#d8e0d0', '#c86a3a'],
        glow: ['#d8eef0'],
        mods: { lure: 0, photophore: 0, barbel: 0.6, teeth: 0.8, bigEye: 0.4, lips: 0.3, eldritch: 0.15 },
      },
      coast: {
        label: 'Coast',
        scene: { bg1: '#5aa6b0', bg2: '#18485a', light: '#f0fff8', bubble: '#f0fbff', speck: '#d8e8c8' },
        rays: 1, snow: 0.6,
        shapes: { torpedo: 4, deep: 2, round: 1.5, slender: 2, long: 0.8 },
        tails: { forked: 3, truncate: 2, rounded: 2, lunate: 1, pointed: 0.5, veil: 0.2 },
        dorsals: { spiny: 3, rounded: 2, swept: 2, double: 1.5, long: 0.6, sail: 0.3 },

      moon: 'Moon', box: 'Box', lionsMane: "Lion's mane", nettle: 'Sea nettle', comb: 'Comb' };

    const kindWeights = (sp, Hb) => Hb.kinds?.[sp] || Object.fromEntries(Object.entries(KINDS[sp]).map(([k, v]) => [k, v.w]));

    // Flat numeric knobs so the lab can bind each to one input.
    const DEFAULT_FISH_CONFIG = {
      patternChance: 0.8,
      scaleChance: 0.4,
      lateralLineChance: 0.35,
      bigEyeChance: 0.2,
      teethChance: 0.2,
      barbelChance: 0.25,

      faceRightChance: 0, // 0 = every fish faces left
      bubbleChance: 0.5,
      lightRays: 1,       // strength of the background light shafts
      // Lovecraftian features — each is further scaled by the habitat's
      // mods.eldritch (near zero in a pond, x2 in the Cosmic Void).
      tentacleChance: 0.3,

      mawChance: 0.25,
      runeChance: 0.2,

    // ---- feature roll ------------------------------------------------------
    // Consume the rng in a FIXED order regardless of config, so knobs are local.
    function rollFeatures(rng, habitat, cfg) {
      const Hb = HABITATS[habitat] || HABITATS[FIRST_HABITAT], m = Hb.mods, f = {};
      f.shape = pickW(rng, Hb.shapes);
      const S = SHAPES[f.shape];
      f.bodyLen = ri(rng, ...S.len);
      f.bodyDepth = ri(rng, ...S.depth);
      f.peak = ri(rng, ...S.peak);
      f.headBlunt = ri(rng, ...S.blunt);
      f.taper = ri(rng, ...S.taper);
      f.backArch = ri(rng, ...S.arch);

      f.tail = pickW(rng, Hb.tails);
      const T = TAILS[f.tail];
      f.tailLen = clamp(ri(rng, ...T.len), 3, 60 - f.bodyLen);
      f.tailSpan = clamp(Math.round(f.bodyDepth * lerp(T.span[0], T.span[1], rng())), 2, 20);

      f.dorsal = pickW(rng, Hb.dorsals);
      const dH = ri(rng, 3, 8);
      f.dorsalH = f.dorsal === 'sail' ? dH + 3 : f.dorsal === 'long' ? Math.ceil(dH * 0.6) : dH;
      f.dorsalStart = ri(rng, 25, 40);
      f.dorsalEnd = ri(rng, 62, 85);
      f.dorsalLean = ri(rng, 0, 6);
      const anal = pickW(rng, { rounded: 3, swept: 2, long: 1, none: 0.6 });
      f.anal = f.dorsal === 'long' ? 'long' : anal; // an eel's fins run together
      f.analH = ri(rng, 2, 6);
      f.analStart = ri(rng, 55, 68);
      f.analEnd = ri(rng, 78, 92);
      // Keep the fin stack inside the 48px frame.
      const room = FISH_H - 4 - f.bodyDepth;
      f.dorsalH = clamp(f.dorsalH, 0, Math.max(1, room - f.analH));
      f.pelvic = rng() < 0.75;
      f.pectoral = ri(rng, 3, 6);
      f.finAlpha = ri(rng, 70, 95);

      const big = rng() < cfg.bigEyeChance * m.bigEye, bigAmt = ri(rng, 1, 2);
      f.eyeR = clamp(clamp(Math.round(f.bodyDepth / 9), 1, 3) + (big ? bigAmt : 0), 1, 5);
      f.eyeColor = pick(rng, Hb.eye);
      f.mouth = pickW(rng, { terminal: 4, up: 1.5, down: 1.5 });
      f.mouthW = ri(rng, 2, 4);
      f.lips = rng() < 0.15 * m.lips;
      f.teeth = rng() < cfg.teethChance * m.teeth;
      const hasBarbels = rng() < cfg.barbelChance * m.barbel, pairs = ri(rng, 1, 2);
      f.barbels = hasBarbels ? pairs : 0;
      f.barbelLen = ri(rng, 3, 8);
      f.lure = rng() < cfg.lureChance * m.lure;
      f.photophores = rng() < cfg.photophoreChance * m.photophore;
      f.glowColor = pick(rng, Hb.glow);
      const spikes = rng() < cfg.spikeChance;
      f.spikes = f.shape === 'round' && spikes;

      f.backColor = pick(rng, Hb.body);
      const bellyPick = pick(rng, Hb.body), bellyMode = rng();
      const back = hx(f.backColor);
      f.bellyColor = bellyMode < 0.55 ? toHex(mix(back, [242, 239, 228], 0.55))
        : bellyMode < 0.8 ? toHex(mix(back, [255, 255, 255], 0.2)) : bellyPick;
      const finPick = pick(rng, Hb.fin);
      f.finColor = rng() < 0.45 ? toHex(mix(back, [255, 255, 255], 0.15)) : finPick;
      const pi = Math.floor(rng() * Hb.pattern.length);
      f.patternColor = Hb.pattern[Hb.pattern[pi] === f.backColor ? (pi + 1) % Hb.pattern.length : pi];
      const patterned = rng() < cfg.patternChance, pat = pickW(rng, Hb.patterns);
      f.pattern = patterned ? pat : 'none';
      f.patternCount = ri(rng, 1, 5);
      f.patternSeed = ri(rng, 0, 999);
      f.scales = rng() < cfg.scaleChance;
      f.lateralLine = rng() < cfg.lateralLineChance;
      f.faceRight = rng() < cfg.faceRightChance;

      // Eldritch traits, rolled last so they never disturb the ordinary ones.
      const ek = m.eldritch ?? 0;
      const tent = rng() < cfg.tentacleChance * ek, tentN = ri(rng, 2, 5);
      f.tentacles = tent ? tentN : 0;
      f.tentacleLen = ri(rng, 6, 13);
      const eyes = rng() < cfg.extraEyeChance * ek, eyeN = ri(rng, 2, 7);
      f.extraEyes = eyes ? eyeN : 0;
      f.maw = rng() < cfg.mawChance * ek;
      f.runes = rng() < cfg.runeChance * ek;
      f.aura = rng() < cfg.auraChance * ek;
      f.skeletal = rng() < cfg.skeletalChance * ek;
      f.eldritchColor = pick(rng, ELDRITCH);
      return f;
    }

    // Reset the body knobs to a shape preset's midpoints (creator "Shape" field).
    function applyShapePreset(f, shape) {
      const S = SHAPES[shape], mid = ([a, b]) => Math.round((a + b) / 2);
      Object.assign(f, { shape, bodyLen: mid(S.len), bodyDepth: mid(S.depth), peak: mid(S.peak),
        headBlunt: mid(S.blunt), taper: mid(S.taper), backArch: mid(S.arch) });
      f.tailLen = clamp(f.tailLen, 3, 60 - f.bodyLen);
    }

    // Stamp a kind preset onto a shark, whale or jelly. With an rng every range
    // and pool is rolled (in a fixed order per kind); without one it takes the
    // midpoints and first colours (the creator's "Kind" field).
    function applyKind(f, kind, habitat, rng = null) {
      const K = KINDS[f.species]?.[kind]; if (!K) return f;
      const Hb = HABITATS[habitat] || HABITATS[FIRST_HABITAT], deep = (Hb.mods.eldritch ?? 0) >= 1;
      const r = (v) => (!Array.isArray(v) ? v : rng ? ri(rng, ...v) : Math.round((v[0] + v[1]) / 2));
      const p = (v) => (!Array.isArray(v) ? v : rng ? pick(rng, v) : v[0]);
      const tintWith = (c, pool, t) => (deep && rng ? toHex(mix(hx(c), hx(pick(rng, pool)), t)) : c);
      f.kind = kind;
      if (f.species === 'jelly') {
        Object.assign(f, { bellShape: K.shape, bellW: r(K.bellW), bellH: r(K.bellH), tentN: r(K.tentN), tentLen: r(K.tentLen),
          oralArms: r(K.oral), oralLen: r(K.oralLen), frilly: rng ? rng() < K.frilly : K.frilly >= 0.5, bellAlpha: r(K.alpha) });
        f.backColor = tintWith(p(K.back), Hb.glow, 0.6);
        f.bellyColor = toHex(mix(hx(f.backColor), [255, 255, 255], 0.4));
        f.finColor = tintWith(p(K.fin), Hb.glow, 0.5);
        f.markings = K.markings;
        f.patternColor = p(K.mark);
        return fitFrame(f);
      }
      const S = { ...(f.species === 'shark' ? SHARK_BASE : WHALE_BASE), ...K };
      Object.assign(f, { shape: 'torpedo', bodyLen: r(S.len), bodyDepth: r(S.depth), peak: r(S.peak), headBlunt: r(S.blunt),
        taper: r(S.taper), backArch: r(S.arch) });
      Object.assign(f, { hammer: !!S.hammer, squareHead: !!S.squareHead, gillSlits: S.gills, tusk: S.tusk ? r(S.tusk) : 0,

        g.eyeColor = '#e0304a';
      }
      if (hasFx(f, 'golden')) remap((c) => mix([118, 70, 10], [255, 228, 124], clamp(luma(c) / 255 * 1.1 + 0.12, 0, 1)));
      if (hasFx(f, 'frozen')) { remap((c) => mix(c, [178, 224, 255], 0.5)); g.glowColor = '#bff4ff'; }
      return g;
    }

    // "Solid" for effect passes includes translucent fins, tentacles and bells.
    const SOLID_A = 40;
    const solidIn = (R) => (x, y) => x >= 0 && y >= 0 && x < FISH_W && y < FISH_H && R[(y * FISH_W + x) * 4 + 3] >= SOLID_A;
    function bbox(R) {
      let x0 = FISH_W, y0 = FISH_H, x1 = -1, y1 = -1;
      const solid = solidIn(R);
      for (let y = 0; y < FISH_H; y++) for (let x = 0; x < FISH_W; x++) if (solid(x, y)) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
      return { x0, y0, x1, y1, ok: x1 >= 0 };
    }
    function sparkle(R, x, y, size, c, a) {
      plot(R, x, y, c, a);
      for (let k = 1; k <= size; k++) {
        const fa = a * (1 - k / (size + 1));
        plot(R, x + k, y, c, fa); plot(R, x - k, y, c, fa); plot(R, x, y + k, c, fa); plot(R, x, y - k, c, fa);
      }
    }

    // Spotted: a leopard coat of dots and rosettes, on the body layer only
    // (before the outline, under the head and eye).
    function spotCoat(R, f) {
      const b = bbox(R); if (!b.ok) return;
      const solid = solidIn(R), rng = makePRNG(`spots|${f.patternSeed}`);
      const base = hx(f.backColor), dark = luma(base) > 100;
      const ink = dark ? sh(base, 0.28) : mix(base, [255, 246, 220], 0.8), core = mix(base, ink, 0.35);
      const n = Math.round((b.x1 - b.x0 + 1) * (b.y1 - b.y0 + 1) / 26);
      for (let i = 0; i < n; i++) {
        const x = ri(rng, b.x0, b.x1), y = ri(rng, b.y0, b.y1), kind = rng();
        if (!solid(x, y)) continue;
        const dot = (px, py, c) => { if (solid(px, py)) plot(R, px, py, c); };
        if (kind < 0.4) { // rosette: broken ring round a tinted core
          for (const [dx, dy] of [[-1, -1], [0, -1], [1, 0], [1, 1], [-1, 1], [-1, 0]]) dot(x + dx, y + dy, ink);
          dot(x, y, core);
        } else if (kind < 0.75) { dot(x, y, ink); dot(x + 1, y, ink); }
        else dot(x, y, ink);
      }
    }

    // Crystal: Voronoi facets, each with its own brightness and a prismatic
    // nudge, bright seams, slightly see-through, and a glint that sweeps by.
    function crystalize(F, f, anim) {
      const b = bbox(F); if (!b.ok) return;
      const solid = solidIn(F), rng = makePRNG(`crystal|${f.patternSeed}`);
      const pts = Array.from({ length: 12 }, () => [ri(rng, b.x0, b.x1), ri(rng, b.y0, b.y1)]);
      const sweep = anim ? ((anim.time * 22) % (FISH_W + 40)) - 20 : b.x0 + (b.x1 - b.x0) * 0.35;
      const tint = [196, 238, 255], ice = [250, 254, 255];
      for (let y = b.y0; y <= b.y1; y++) for (let x = b.x0; x <= b.x1; x++) {
        if (!solid(x, y)) continue;
        let d1 = 1e9, d2 = 1e9, cell = 0;
        pts.forEach(([px, py], k) => { const d = Math.hypot(x - px, y - py); if (d < d1) { d2 = d1; d1 = d; cell = k; } else if (d < d2) d2 = d; });
        const i = (y * FISH_W + x) * 4;
        let c = mix([F[i], F[i + 1], F[i + 2]], tint, 0.4);
        c = hueShift(sh(c, 0.82 + 0.4 * hash(cell, 5)), (cell % 3 - 1) * 25);
        const seam = d2 - d1 < 1.1, glint = Math.abs(x - y * 0.6 - sweep) < 1.5;
        if (seam) c = mix(c, ice, 0.55);
        if (glint) c = mix(c, ice, 0.7);
        F[i] = clamp(c[0], 0, 255); F[i + 1] = clamp(c[1], 0, 255); F[i + 2] = clamp(c[2], 0, 255);
        F[i + 3] = F[i + 3] * (seam || glint ? 0.95 : 0.8);
      }
    }

    // Frozen: rime along every upper edge, frost flecks, icicles off the
    // undersides. (The slow swim is applied to the anim in paintFish.)
    function frost(F, f, anim) {
      const solid = solidIn(F), rime = [236, 250, 255], icicle = [196, 236, 255];
      const tops = [], drips = [];
      for (let y = 0; y < FISH_H; y++) for (let x = 0; x < FISH_W; x++) {
        if (!solid(x, y)) continue;
        if (!solid(x, y - 1)) tops.push(x, y);
        else if (hash(x * 3, y + f.patternSeed) > 0.93) tops.push(x, y); // fleck
        if (!solid(x, y + 1) && hash(x, f.patternSeed) > 0.78) drips.push(x, y);
      }
      for (let i = 0; i < tops.length; i += 2) plot(F, tops[i], tops[i + 1], rime, 0.85);
      const shimmer = anim ? anim.time : 0;
      for (let i = 0; i < drips.length; i += 2) {
        const x = drips[i], y = drips[i + 1], len = 1 + Math.floor(hash(x + 9, f.patternSeed) * 3);
        for (let k = 1; k <= len; k++) plot(F, x, y + k, icicle, 0.9 - k * 0.2);
        if (anim && Math.sin(shimmer * 3 + x) > 0.9) plot(F, x, y + len, rime, 0.9);
      }
    }

    // Glowing: a soft halo in the glow colour, pulsing when animated, and a
    // little of that light bleeding into the flesh.
    function glowHalo(F, f, anim) {
      const solid = solidIn(F), glow = hx(f.glowColor || '#bff4ff'), pulse = anim ? anim.glow : 1;
      const halo = [];
      for (let y = 0; y < FISH_H; y++) for (let x = 0; x < FISH_W; x++) {
        if (solid(x, y)) { continue; }
        let d = 9;
        for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) if (solid(x + dx, y + dy)) d = Math.min(d, Math.hypot(dx, dy));
        if (d <= 3.2) halo.push(x, y, d);
      }
      for (let i = 0; i < F.length; i += 4) if (F[i + 3] >= 128) {
        const c = mix([F[i], F[i + 1], F[i + 2]], glow, 0.16 * pulse);
        F[i] = c[0]; F[i + 1] = c[1]; F[i + 2] = c[2];
      }
      for (let i = 0; i < halo.length; i += 3) plot(F, halo[i], halo[i + 1], glow, (0.62 - halo[i + 2] * 0.17) * pulse);
    }

    // Golden: a bright metallic band across the upper flank plus a few
    // twinkling glints.
    function goldSheen(F, f, anim) {
      const b = bbox(F); if (!b.ok) return;
      const solid = solidIn(F), hi = [255, 248, 200];
      const sweep = anim ? Math.sin(anim.time * 1.4) * 0.15 : 0;
      for (let y = b.y0; y <= b.y1; y++) for (let x = b.x0; x <= b.x1; x++) {
        if (!solid(x, y)) continue;
        const v = (y - b.y0) / Math.max(1, b.y1 - b.y0) - 0.3 - sweep + (x - b.x0) * 0.004;
        if (Math.abs(v) < 0.09) plot(F, x, y, hi, 0.55 * (1 - Math.abs(v) / 0.09));
      }
      const rng = makePRNG(`gold|${f.patternSeed}`);
      for (let k = 0; k < 3; k++) {
        const x = ri(rng, b.x0 + 2, b.x1 - 2), y = ri(rng, b.y0 + 1, b.y1 - 1), ph = rng() * 6;
        if (!solid(x, y)) continue;
        const tw = anim ? Math.max(0, Math.sin(anim.time * 3 + ph)) : 0.8;
        if (tw > 0.05) sparkle(F, x, y, 1, [255, 255, 236], tw);
      }
    }

    // Shiny: big four-point stars twinkling just around the silhouette.
    function shineSparkles(F, f, anim) {
      const b = bbox(F); if (!b.ok) return;
      const rng = makePRNG(`shine|${f.patternSeed}`);
      for (let k = 0; k < 4; k++) {
        const x = ri(rng, b.x0 - 2, b.x1 + 2), y = ri(rng, b.y0 - 3, b.y1 + 2), ph = rng() * 6.28;
        const tw = anim ? Math.max(0, Math.sin(anim.time * 2.6 + ph)) : [1, 0.7, 0.45, 0.8][k];
        if (tw > 0.05) sparkle(F, x, y, tw > 0.6 ? 2 : 1, k % 2 ? [255, 250, 210] : [255, 255, 255], 0.95 * tw);
      }
    }

    // Raster-level effects over the finished fish layer, in a fixed order.
    function applyEffects(F, f, anim) {
      if (hasFx(f, 'crystal')) crystalize(F, f, anim);
      if (hasFx(f, 'frozen')) frost(F, f, anim);
      if (hasFx(f, 'glowing')) glowHalo(F, f, anim);
      if (hasFx(f, 'golden')) goldSheen(F, f, anim);
      if (hasFx(f, 'shiny')) shineSparkles(F, f, anim);
      return F;
    }

    // ---- scene -------------------------------------------------------------
    function paintBackground(R, habitat, scene, cfg, seed, anim) {
      const Hb = HABITATS[habitat] || HABITATS[FIRST_HABITAT];
      const c1 = hx(scene.bg1), c2 = hx(scene.bg2), light = hx(scene.light), speck = hx(scene.speck);
      const drift = anim ? anim.time : 0, rays = Hb.rays * cfg.lightRays;
      for (let y = 0; y < FISH_H; y++) {
        const base = mix(c1, c2, y / (FISH_H - 1));
        for (let x = 0; x < FISH_W; x++) {
          plot(R, x, y, base);
          if (rays > 0) {
            const r = Math.sin((x * 0.55 + y * 0.3) * 0.45 + seed * 0.37 + drift * 0.4);
            if (r > 0.6) plot(R, x, y, light, (r - 0.6) * 0.3 * rays * (1 - y / FISH_H));
          }
        }
      }
      const n = Math.round(14 * Hb.snow); // drifting specks / marine snow
      for (let i = 0; i < n; i++) {
        const x = Math.floor(hash(i, seed) * FISH_W);
        const y = Math.floor((hash(seed, i) * FISH_H + drift * 2 * (0.5 + hash(i, i))) % FISH_H);
        plot(R, x, y, speck, 0.45);
      }
      if (Hb.nebula) { // two octaves of cloud in the scene's light colour
        for (let y = 0; y < FISH_H; y++) for (let x = 0; x < FISH_W; x++) {
          const nb = noise((x + seed + drift * 0.3) / 9, y / 7) * 0.7 + noise(x / 4, (y + seed) / 4) * 0.3;
          if (nb > 0.5) plot(R, x, y, light, (nb - 0.5) * 0.9 * Hb.nebula);
        }
      }
      const stars = Math.round(28 * (Hb.stars || 0));
      for (let i = 0; i < stars; i++) {
        const x = Math.floor(hash(i + 7, seed) * FISH_W), y = Math.floor(hash(seed, i + 7) * FISH_H);
        const tw = anim ? 0.35 + 0.65 * Math.abs(Math.sin(drift * 1.7 + i * 1.3)) : 0.4 + 0.6 * hash(i, seed + 1);
        plot(R, x, y, speck, tw);
        if (hash(i, i + seed) > 0.85) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) plot(R, x + dx, y + dy, speck, 0.3 * tw);
      }
    }
    function bubble(R, x, y, c, big, a) {
      if (!big) { plot(R, x, y, c, a); return; }
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) plot(R, x + dx, y + dy, c, a);
      plot(R, x, y, c, a * 0.15);
    }

    // ---- jellyfish ---------------------------------------------------------
    // Upright, bell on top. The bell pulses (wider and shorter on the beat)
    // and the tentacles trail in a wave that runs down their length.
    const BELLS = { // half-width profile, 0 at the apex .. 1 at the rim
      dome: (v) => Math.sqrt(Math.max(0, 1 - (1 - v) ** 2)),
      flat: (v) => Math.pow(Math.max(0, 1 - (1 - v) ** 2), 0.3),
      bell: (v) => Math.pow(Math.sin((Math.PI / 2) * v), 0.7) * (0.75 + 0.25 * v),
      box:  (v) => (v < 0.2 ? 0.7 + 1.5 * v : 1),
      oval: (v) => Math.sqrt(Math.max(0, 1 - (2 * v - 1) ** 2)), // a comb jelly is a closed lozenge
    };
    function jellyGeom(f, anim) {
      const pulse = anim ? Math.sin(anim.time * 2.4 + (f.patternSeed % 7)) : 0;
      const reach = Math.max(f.tentN ? f.tentLen : 0, f.oralArms ? f.oralLen : 0);
      const top = Math.max(2, Math.round((FISH_H - f.bellH - reach) / 2));
      const W = f.bellW * (1 + 0.08 * pulse), H = Math.max(4, f.bellH * (1 - 0.1 * pulse));
      return { cx: (FISH_W - 1) / 2, top, W, H, rim: Math.round(top + H), pulse, time: anim ? anim.time : 0 };
    }
    const bellHalf = (f, J, y) => { const v = (y - J.top) / J.H; return v < 0 || v > 1 ? -1 : (J.W / 2) * (BELLS[f.bellShape] || BELLS.dome)(v); };
    function jellyMark(f, J, x, y, v) {
      switch (f.markings) {
        case 'rings': { // moon jelly: four horseshoe gonads seen through the bell
          const ry = J.top + J.H * 0.42;
          for (let i = 0; i < 4; i++) {
            const d = Math.hypot(x - (J.cx + (i - 1.5) * J.W * 0.17), (y - ry) * 1.2);
            if (Math.abs(d - 1.6) < 0.7) return 0.9;
          }
          return 0;
        }
        case 'stripes': { // radial stripes fanning from above the apex
          if (v < 0.15) return 0;
          const ang = Math.atan2(x - J.cx, y - (J.top - J.H * 0.5));
          return Math.floor(ang * 9 + 100) % 2 === 0 ? 0.55 : 0;
        }
        case 'spots': return hash(x + f.patternSeed, y) > 0.86 ? 0.8 : 0;
        default: return 0; // 'comb' rows are drawn animated, over the outline
      }
    }
    function drawBell(R, f, J) {
      const back = hx(f.backColor), belly = hx(f.bellyColor), pat = hx(f.patternColor), a0 = f.bellAlpha / 100;
      for (let y = J.top; y <= J.rim; y++) {
        const hw = bellHalf(f, J, y); if (hw < 0) continue;
        const v = (y - J.top) / J.H;
        for (let x = Math.round(J.cx - hw); x <= Math.round(J.cx + hw); x++) {
          const dx = (x - J.cx) / Math.max(hw, 0.5);
          const edge = Math.abs(dx) > 0.82 || y === J.top;
          const cavity = f.bellShape !== 'oval' && v > 0.5 && Math.abs(dx) < 0.7; // the hollow underside
          let c = mix(back, belly, v * 0.45 + (cavity ? 0.35 : 0));
          let a = cavity ? a0 * 0.75 : edge ? Math.min(1, a0 + 0.3) : a0;
          const m = jellyMark(f, J, x, y, v);
          if (m) { c = mix(c, pat, m); a = Math.max(a, 0.85 * m); }
          if (dx < -0.25 && dx > -0.7 && v > 0.12 && v < 0.4) c = mix(c, [255, 255, 255], 0.35); // gloss
          plot(R, x, y, c, a);
        }
      }
      if (f.bellShape !== 'oval') { // scalloped margin
        const hw = J.W / 2 * BELLS[f.bellShape](1), rimC = mix(back, [255, 255, 255], 0.35);
        for (let x = Math.round(J.cx - hw); x <= Math.round(J.cx + hw); x++) if (!f.frilly || x % 2 === 0) plot(R, x, J.rim + 1, rimC, 0.85);
      }
    }
    // Tentacles off the rim and oral arms from the centre, drawn behind the bell.
    function drawJellyTrailers(R, f, J) {
      const fin = hx(f.finColor), t = J.time, seed = f.patternSeed;
      const spread = f.bellShape === 'oval' ? 2 : (J.W / 2) * 0.85;
      for (let i = 0; i < f.tentN; i++) {
        const u = f.tentN === 1 ? 0 : (i / (f.tentN - 1)) * 2 - 1, x0 = J.cx + u * spread, ph = i * 1.37 + seed;
        for (let k = 1; k <= f.tentLen; k++) {
          const sway = Math.sin(k * 0.28 - t * 2.6 + ph) * Math.min(2.5, k * 0.14) - J.pulse * u * k * 0.05;
          plot(R, Math.round(x0 + sway), J.rim + k, fin, 0.9 - 0.55 * k / f.tentLen);
        }
      }
      const arm = mix(hx(f.bellyColor), hx(f.patternColor), 0.35);
      for (let j = 0; j < f.oralArms; j++) {
        const x0 = J.cx + (j - (f.oralArms - 1) / 2) * 2.2;
        for (let k = 0; k <= f.oralLen; k++) {
          const sway = Math.sin(k * 0.2 - t * 1.6 + j * 2) * Math.min(2, k * 0.12), x = Math.round(x0 + sway), y = J.rim - 1 + k;
          plot(R, x, y, arm, 0.9);
          if (k < f.oralLen * 0.8) plot(R, x + 1, y, sh(arm, 0.85), 0.85);
          if (f.frilly && hash(k + j * 31, seed) > 0.45) plot(R, x + (k % 2 ? 2 : -1), y, arm, 0.7);
        }
      }
    }
    // Comb rows, rim lights, and the eldritch extras a bell can carry.
    function drawJellyExtras(R, f, J, anim) {
      const glow = hx(f.glowColor), pulse = anim ? anim.glow : 1, seed = f.patternSeed, tick = Math.floor(J.time * 8);
      if (f.markings === 'comb') { // rainbow-shimmering cilia rows
        [-0.6, -0.2, 0.2, 0.6].forEach((r, ri2) => {
          for (let y = J.top + 1; y < J.rim; y++) {
            const hw = bellHalf(f, J, y); if (hw < 1) continue;
            const col = hueShift([255, 90, 90], (y * 35 + J.time * 240 + ri2 * 90) % 360);
            plot(R, Math.round(J.cx + r * hw), y, col, (y + tick) % 2 ? 0.9 : 0.45);
          }
        });
      }
      if (f.rimLights) for (let y = J.top + 2; y <= J.rim; y += 2) {
        const hw = bellHalf(f, J, y); if (hw < 1) continue;
        const tw = 0.55 + 0.45 * Math.sin(J.time * 3 + y) * pulse;
        for (const s of [-1, 1]) plot(R, Math.round(J.cx + s * hw), y, glow, tw);
      }
      const eld = hx(f.eldritchColor);
      if (f.runes) {
        const glyph = GLYPHS[seed % GLYPHS.length], x = Math.round(J.cx) - 1, y = Math.round(J.top + J.H * 0.3);
        for (let gy = 0; gy < 3; gy++) for (let gx = 0; gx < 3; gx++) if (glyph[gy][gx]) plot(R, x + gx, y + gy, eld, 0.55 + 0.45 * pulse);
      }
      if (f.extraEyes > 0) { // a cluster of eyes in the jelly, blinking out of step
        const cx = Math.round(J.cx + (hash(seed, 7) - 0.5) * J.W * 0.25), cy = Math.round(J.top + J.H * (0.4 + 0.15 * hash(seed, 11)));
        const inside = (x, y) => [y - 1, y, y + 1].every(yy => bellHalf(f, J, yy) - 1 >= Math.abs(x - J.cx)) && y + 1 <= J.rim;
        eyeCluster(f.extraEyes, cx, cy, seed, inside).forEach(([x, y], i) => {
          if (anim && Math.sin(J.time * 1.3 + i * 2.1) > 0.96) { hLine3(R, x, y, sh(hx(f.backColor), 0.5)); return; }
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (!(dx && dy)) plot(R, x + dx, y + dy, paleIris(i % 2 ? eld : hx(f.eyeColor)));
          plot(R, x, y, PUPIL);
        });
      }
    }

    // ---- entry points ------------------------------------------------------
    // Paint a fish from an explicit feature object into a FISH_W x FISH_H 2D
    // context. All drawing happens in plain RGBA buffers; the context is only
    // touched once, by putImageData, so callers' transforms don't apply.
    function paintFish(ctx, f0, habitat, cfg, bgSeed, anim = null) {
      const Hb = HABITATS[habitat] || HABITATS[FIRST_HABITAT];
      const scene = cfg.scene || Hb.scene;
      const f = effectColours(f0); // mutation effects recolour a copy, never the caller's object
      const jelly = f.species === 'jelly';
      const out = raster();
      if (!cfg.transparentBackground) paintBackground(out, habitat, scene, cfg, bgSeed, anim);
      if (anim && hasFx(f, 'frozen')) anim = { ...anim, waveAmp: anim.waveAmp * 0.35, tail: anim.tail * 0.35, pect: anim.pect * 0.35, time: anim.time * 0.5 };
      if (anim && jelly) anim = { ...anim, waveAmp: 0, bob: Math.round(Math.sin(anim.time * 0.9 + 1) * 1.5) }; // drifts, doesn't swim

      const fins = raster(), body = raster();
      let G = null;
      if (jelly) {
        const J = jellyGeom(f, anim);
        drawJellyTrailers(fins, f, J);
        drawBell(body, f, J);
        if (hasFx(f, 'spotted')) spotCoat(body, f);
        edgeDarken(body, 0.8);
        drawJellyExtras(body, f, J, anim);
      } else {
        G = makeGeom(f);
        drawTail(fins, f, G, anim); drawDorsal(fins, f, G); drawAnal(fins, f, G); drawPelvic(fins, f, G);
        edgeDarken(fins, 0.7);
        drawBody(body, f, G);
        if (hasFx(f, 'spotted')) spotCoat(body, f);
        edgeDarken(body, 0.6);
        drawHead(body, f, G, anim);
        drawPectoral(body, f, G, anim);
        drawExtras(body, f, G, anim);
      }
      over(fins, body);
      const fish = applyEffects(f.aura ? voidAura(fins, f, anim) : fins, f, anim);

      // Composite with optional mirroring + a swim wave that grows toward the tail.
      const flip = !!f.faceRight;
      for (let x = 0; x < FISH_W; x++) {
        let dy = 0;
        if (anim) {
          const w = G ? clamp((x - (G.x0 + G.L * 0.3)) / (G.L * 0.7 + G.tailLen), 0, 1) : 0;
          dy = Math.round(anim.waveAmp * w * Math.sin(anim.wave - x * 0.25)) + anim.bob;
        }
        const dx = flip ? FISH_W - 1 - x : x;
        for (let y = 0; y < FISH_H; y++) {
          const i = (y * FISH_W + x) * 4, a = fish[i + 3];
          if (a) plot(out, dx, y + dy, [fish[i], fish[i + 1], fish[i + 2]], a / 255);
        }
      }

      // Bubbles rise from the mouth: a steady stream when animated, a seeded
      // few frozen in place otherwise. (Jellyfish don't breathe air bubbles.)
      if (jelly) { ctx.putImageData(new ImageData(out, FISH_W, FISH_H), 0, 0); return f0; }
      const [mx0, my] = mouthPoint(f, G), mx = flip ? FISH_W - 1 - mx0 : mx0;
      const bc = hx(scene.bubble);
      if (anim) {
        if (cfg.bubbleChance > 0) for (let i = 0; i < 3; i++) {
          const age = (anim.time * 0.45 + i / 3) % 1;
          bubble(out, mx + Math.round(Math.sin(age * 9 + i * 2)), Math.round(my - 2 - age * (my + 2)), bc, age > 0.35, 0.85 * (1 - age * 0.4));
        }
      } else {
        const rng = makePRNG(`fishbubbles|${bgSeed}`);
        if (rng() < cfg.bubbleChance) {
          const n = ri(rng, 1, 3);
          for (let k = 0; k < n; k++) bubble(out, mx + ri(rng, -1, 1), my - 3 - k * 4 - ri(rng, 0, 1), bc, k > 0, 0.85);
        }
      }
      ctx.putImageData(new ImageData(out, FISH_W, FISH_H), 0, 0);
      return f0;
    }

    // Draw one creature, deriving every feature from (seed, habitat). `species`
    // pins the body plan ('fish' | 'shark' | 'whale' | 'jelly'); leave it null
    // (or 'any') to let the habitat's species mix decide.
    function drawFish(ctx, seedStr, habitat = FIRST_HABITAT, config = {}, species = null) {
      const cfg = { ...DEFAULT_FISH_CONFIG, ...config };
      const f = rollAny(seedStr, habitat, cfg, species);
      return paintFish(ctx, f, habitat, cfg, Math.floor(hash(seedStr.length, f.patternSeed) * 1000));
    }
    // The rolled feature object for a seed — a starting point for manual editing.
    function featuresFromSeed(seedStr, habitat = FIRST_HABITAT, config = {}, species = null) {
      return rollAny(seedStr, habitat, { ...DEFAULT_FISH_CONFIG, ...config }, species);
    }
    // Draw from an explicit feature object (creator), bypassing the roll.
    function drawFishFeatures(ctx, features, habitat = FIRST_HABITAT, config = {}, anim = null) {
      const cfg = { ...DEFAULT_FISH_CONFIG, ...config };
      return paintFish(ctx, { ...features }, habitat, cfg, features.patternSeed, anim);
    }
    // Pure idle-swim driver: (elapsed ms, per-fish phase) -> per-frame deltas,
    // so the same fish swims identically on every client without shared state.
    function fishAnim(tMs, phase = 0) {
      const t = tMs / 1000 + phase;
      return {
        time: t,
        wave: t * 6, waveAmp: 1.2,                         // body undulation
        tail: Math.sin(t * 6 - 1.2),                       // caudal beat
        pect: Math.sin(t * 8 + phase),                     // pectoral flutter
        bob: Math.round(Math.sin(t * 1.3 + phase * 2) * 0.9),
        glow: 0.65 + 0.35 * Math.sin(t * 2.2 + phase),     // lure / photophores
        gulp: t % 3.3 < 0.35,                              // mouth opens briefly
      };
    }
    // Browser-only: nearest-neighbour upscale to `width` (height keeps 4:3).
    function renderFishDataURL(seedStr, habitat = FIRST_HABITAT, width = 128, config = {}, species = null) {
      return upscaledDataURL((ctx) => drawFish(ctx, seedStr, habitat, config, species), width);
    }
    function renderFishFeaturesDataURL(features, habitat = FIRST_HABITAT, width = 128, config = {}) {
      return upscaledDataURL((ctx) => drawFishFeatures(ctx, features, habitat, config), width);
    }
    function upscaledDataURL(drawInto, width) {
      const src = document.createElement('canvas');
      src.width = FISH_W; src.height = FISH_H;
      drawInto(src.getContext('2d'));
      const out = document.createElement('canvas');
      out.width = width; out.height = Math.round(width * FISH_H / FISH_W);
      const octx = out.getContext('2d');
      octx.imageSmoothingEnabled = false;
      octx.drawImage(src, 0, 0, out.width, out.height);
      return out.toDataURL('image/png');
    }

    // Every editable feature, for the creator UI. Types: bool, int (min/max),
    // color (options = suggested swatches), enum (values or [label, value]).
    // `rebuild` re-renders the controls after a change (the shape preset
    // rewrites several other fields).
    const t1 = (v) => [v.charAt(0).toUpperCase() + v.slice(1), v];

    const FEATURE_SCHEMA = [

      { group: 'Kind', key: 'kind', type: 'enum', label: 'Kind preset', only: ['shark', 'whale', 'jelly'],
        options: (f) => Object.keys(KINDS[f.species] || {}).map((k) => [KIND_LABELS[k] || k, k]),

      { group: 'Shark & whale', key: 'squareHead', type: 'bool', label: 'Square head', only: ['whale'] },
      { group: 'Shark & whale', key: 'tusk', type: 'int', label: 'Tusk', min: 0, max: 16, only: ['whale'] },
      { group: 'Shark & whale', key: 'pleats', type: 'bool', label: 'Throat pleats', only: ['whale'] },
      { group: 'Shark & whale', key: 'knobs', type: 'bool', label: 'Head knobs', only: ['whale'] },
      { group: 'Shark & whale', key: 'eyePatch', type: 'bool', label: 'Eye patch', only: ['whale'] },
      { group: 'Jellyfish', key: 'bellShape', type: 'enum', label: 'Bell', options: BELL_SHAPES.map(t1), only: ['jelly'] },
      { group: 'Jellyfish', key: 'bellW', type: 'int', label: 'Bell width', min: 8, max: 30, only: ['jelly'] },
      { group: 'Jellyfish', key: 'bellH', type: 'int', label: 'Bell height', min: 5, max: 22, only: ['jelly'] },
      { group: 'Jellyfish', key: 'bellAlpha', type: 'int', label: 'Bell opacity %', min: 25, max: 100, only: ['jelly'] },

      { group: 'Jellyfish', key: 'tentLen', type: 'int', label: 'Tentacle length', min: 0, max: 34, only: ['jelly'] },
      { group: 'Jellyfish', key: 'oralArms', type: 'int', label: 'Oral arms', min: 0, max: 4, only: ['jelly'] },
      { group: 'Jellyfish', key: 'oralLen', type: 'int', label: 'Arm length', min: 0, max: 28, only: ['jelly'] },
      { group: 'Jellyfish', key: 'frilly', type: 'bool', label: 'Frilly', only: ['jelly'] },
      { group: 'Jellyfish', key: 'markings', type: 'enum', label: 'Markings', options: MARKINGS.map(t1), only: ['jelly'] },
      { group: 'Jellyfish', key: 'rimLights', type: 'bool', label: 'Rim lights', only: ['jelly'] },
    ];
    { // Shared by every species (jellies included) / fish-only fields.
      const shared = ['backColor', 'bellyColor', 'finColor', 'patternColor', 'patternSeed', 'glowColor', 'eyeColor',
        'extraEyes', 'runes', 'aura', 'eldritchColor', 'effects'];
      // What the shared colours are called on a jellyfish (all under one group).
      const jellyLabels = { backColor: 'Bell', bellyColor: 'Inner bell', finColor: 'Tentacles', patternColor: 'Markings / arms',
        glowColor: 'Rim-light colour', eyeColor: 'Iris (extra eyes)', patternSeed: 'Pattern seed' };
      for (const field of FEATURE_SCHEMA) {
        if (jellyLabels[field.key]) field.jelly = { group: 'Colour', label: jellyLabels[field.key] };
        if (shared.includes(field.key)) field.only = ALL_SPECIES;
        else if (field.key === 'shape' || field.key === 'pectoral') field.only = ['fish'];
        else field.only ??= SWIMMERS;
      }
    }
    const SCHEMA_BY_KEY = Object.fromEntries(FEATURE_SCHEMA.map((f) => [f.key, f]));
    const fieldsFor = (f) => FEATURE_SCHEMA.filter((field) => field.only.includes(f.species || 'fish'))
      .map((field) => (f.species === 'jelly' && field.jelly ? { ...field, ...field.jelly } : field));

    // ---- breeding ----------------------------------------------------------
    // Genes that travel together, so a child inherits a recognisable tail or
    // dorsal fin from one parent instead of a mash of unrelated numbers. Every
    // other feature is its own gene.
    // A group only uses the keys its species has, so one table serves all.
    // The kind travels with the body it shaped, so a hammerhead x thresher
    // child is one or the other up front, but may borrow the other's tail.
    const GENE_LINKS = [
      ['shape', 'kind', 'bodyLen', 'bodyDepth', 'peak', 'headBlunt', 'taper', 'backArch', 'hammer', 'squareHead', 'gillSlits', 'tusk',
        'bellShape', 'bellW', 'bellH'],
      ['tail', 'tailLen', 'tailSpan', 'upperLobe'],
      ['dorsal', 'dorsalH', 'dorsalStart', 'dorsalEnd', 'dorsalLean'],
      ['anal', 'analH', 'analStart', 'analEnd'],
      ['pattern', 'patternCount', 'patternSeed'],
      ['barbels', 'barbelLen'],
      ['tentacles', 'tentacleLen'],
      ['eyePatch', 'pleats', 'knobs'],
      ['tentN', 'tentLen'],
      ['oralArms', 'oralLen', 'frilly'],
    ];
    // Only the same species can breed (kinds within a species are fine).
    const canBreed = (a, b) => (a.species || 'fish') === (b.species || 'fish');
    // Mutation effects for a child, from their own stream so they never shift
    // the gene rolls. Each effect a parent carries passes on 35% of the time
    // (65% if both carry it); then fresh effects roll, each one rarer than the
    // last: effectChance for the first, then EFFECT_STACK. Weighted by
    // EFFECTS[k].weight, capped at MAX_EFFECTS. Returns { effects, fresh }.
    function rollEffects(a, b, seedStr, habitat, effectChance) {
      const rng = makePRNG(`effects|${habitat}|${seedStr}`), effects = [], fresh = [];
      for (const k of EFFECT_KEYS) {
        const n = hasFx(a, k) + hasFx(b, k), r = rng();
        if (n && r < (n === 2 ? 0.65 : 0.35) && effects.length < MAX_EFFECTS) effects.push(k);
      }
      while (effects.length < MAX_EFFECTS) {
        const odds = effects.length ? EFFECT_STACK[effects.length - 1] : effectChance;
        if (rng() >= odds) break;
        const k = pickW(rng, Object.fromEntries(EFFECT_KEYS.filter((e) => !effects.includes(e)).map((e) => [e, EFFECTS[e].weight])));
        effects.push(k); fresh.push(k);
      }
      return { effects: EFFECT_KEYS.filter((k) => effects.includes(k)), fresh };
    }

    // Cross two creatures of the same species and habitat. Each gene group
    // comes from one parent; within it a number may land anywhere between the
    // two parents and a colour may blend. A `mutation` share of genes is taken
    // instead from a fresh creature of that species and habitat, so mutations
    // stay native to both. Deterministic: the same parents + seedStr always
    // give the same child. Returns the child, per feature where it came from
    // ('A' | 'B' | 'mix' | 'mut'), and which mutation effects were new.
    // Throws if the parents are different species.
    function breedFeatures(a, b, seedStr, habitat = FIRST_HABITAT, config = {}, mutation = 0.05, effectChance = 0.15) {
      if (!canBreed(a, b)) throw new Error(`Can't cross a ${SPECIES[a.species || 'fish'].label} with a ${SPECIES[b.species || 'fish'].label}`);
      const cfg = { ...DEFAULT_FISH_CONFIG, ...config }, species = a.species || 'fish';
      const rng = makePRNG(`breed|${habitat}|${seedStr}`);
      const mutant = featuresFromSeed(`mutant|${seedStr}`, habitat, cfg, species);
      const linked = new Set(GENE_LINKS.flat());
      const groups = [...GENE_LINKS.map((g) => g.filter((k) => k in mutant)).filter((g) => g.length),
        ...Object.keys(mutant).filter((k) => !linked.has(k) && k !== 'species').map((k) => [k])];
      const child = { species }, origin = {};
      for (const group of groups) {
        const fromA = rng() < 0.5;
        for (const key of group) {
          const field = SCHEMA_BY_KEY[key], va = a[key] ?? mutant[key], vb = b[key] ?? mutant[key];
          const rBlend = rng(), t = rng(), rMut = rng(); // always three draws: fixed stream
          let v = fromA ? va : vb, o = fromA ? 'A' : 'B';
          if (va !== vb && field?.type === 'int' && rBlend < 0.4) { v = Math.round(lerp(va, vb, t)); o = 'mix'; }
          else if (va !== vb && field?.type === 'color' && rBlend < 0.3) { v = toHex(mix(hx(va), hx(vb), t)); o = 'mix'; }
          if (rMut < mutation) { v = mutant[key]; o = 'mut'; }
          if (field?.type === 'int') v = clamp(v, field.min, field.max);
          child[key] = v; origin[key] = o;
        }
      }
      fitFrame(child);
      const { effects, fresh } = rollEffects(a, b, seedStr, habitat, effectChance);
      child.effects = effects;
      return { child, origin, freshEffects: fresh };
    }

    // =======================================================================
    // lab UI
    // =======================================================================
    const $ = (id) => document.getElementById(id);
    const habitatSel = $('habitat'), speciesSel = $('species'), seedInput = $('seed'), sizeSel = $('size');
    const pinnedSpecies = () => (speciesSel.value === 'any' ? null : speciesSel.value);

    let habitat = Object.keys(HABITATS)[0];
    let scenes = Object.fromEntries(Object.entries(HABITATS).map(([k, h]) => [k, { ...h.scene }])); // working copy
    let config = { ...DEFAULT_FISH_CONFIG };
    let gallerySeeds = freshGallery();
    let customMode = false, breedMode = false;
    let features = null;
    // Breeding pen state. A parent is either seed-derived or a promoted child /
    // creator fish; `hab` pins it to the habitat it was made in, so the pen
    // only ever crosses two fish of the current habitat.
    const parents = { A: null, B: null };
    let mutation = 0.05, effectChance = 0.15, litterSeed = 'litter_1';
    let creatorTab = null; // which creator tab is open, kept across re-renders
    let anchor = 'A', penNotice = ''; // anchor: the parent whose species the other must match
    const LITTER = 16;

    function freshGallery() { return Array.from({ length: 48 }, () => 'g_' + Math.floor(Math.random() * 1e9).toString(36)); }
    const cfgFor = (hab) => ({ ...config, scene: scenes[hab] });
    const url = (seed, hab, w) => renderFishDataURL(seed, hab, w, cfgFor(hab), pinnedSpecies());

    for (const [key, h] of Object.entries(HABITATS)) habitatSel.add(new Option(h.label, key));
    speciesSel.add(new Option('Habitat mix', 'any'));
    for (const [key, s] of Object.entries(SPECIES)) speciesSel.add(new Option(`${s.icon} ${s.plural}`, key));

    function buildConfigControls() {
      const cfg = $('cfg'); cfg.innerHTML = '';
      for (const key of Object.keys(config)) {
        const wrap = document.createElement('div'); wrap.className = 'knob';
        const input = document.createElement('input');

        input.addEventListener('input', () => { const v = parseFloat(input.value); if (!Number.isNaN(v)) { config[key] = v; renderAll(); } });

    function buildPaletteControls() {
      const pal = $('palette'); pal.innerHTML = '';
      for (const [key, color] of Object.entries(scenes[habitat])) {
        const row = document.createElement('div'); row.className = 'swatch';

    function makeCell(seed, hab, w, cap) {
      const cell = document.createElement('div'); cell.className = 'cell';
      const img = document.createElement('img');
      img.width = w; img.height = Math.round(w * FISH_H / FISH_W);
